<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PhotoMap</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>
  :root{
    --bg:#ffffff; --panel:#ffffff; --panel2:#F8F9FB; --line:#E3E5E8; --line2:#C7CAD1;
    --text:#2E3035; --ink:#1E1F22; --muted:#5C5E66; --dim:#80848E; --faint:#9A9DA5;
    --accent:#5865F2; --accent2:#4752C4; --accent-tint:#EEF0FE; --good:#3BA55C; --bad:#D83C3E;
    --font:'Aptos','Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,sans-serif;
    --mono:'Aptos Mono','Cascadia Code',ui-monospace,monospace;
    --header-h:58px; --gallery-w:360px; --thumb:120px; --img-w:42%;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{background:var(--bg);color:var(--text);font-family:var(--font);overflow:hidden;-webkit-font-smoothing:antialiased;}
  ::selection{background:#D9DDFB;}

  header{height:var(--header-h);display:flex;align-items:center;gap:14px;padding:0 16px;
    background:var(--panel);border-bottom:1px solid var(--line);position:relative;z-index:1200;}
  .brand{display:flex;align-items:center;gap:9px;flex:0 0 auto;}
  .brand .mark{width:24px;height:24px;border-radius:6px;position:relative;background:radial-gradient(circle at 35% 30%,var(--accent),var(--accent2));box-shadow:0 1px 4px #5865F255;}
  .brand .mark::after{content:"";position:absolute;inset:0;margin:auto;width:6px;height:6px;border-radius:50%;background:#fff;}
  .brand h1{font-family:var(--font);font-weight:700;font-size:17px;margin:0;color:var(--ink);}
  .brand h1 span{color:var(--accent);}

  .toolbar{display:flex;gap:6px;align-items:center;}
  .btn{font-family:var(--mono);font-size:11px;letter-spacing:.4px;text-transform:uppercase;border-radius:7px;padding:8px 11px;cursor:pointer;transition:all .12s ease;white-space:nowrap;}
  .btn.primary{color:#fff;background:var(--accent);border:none;box-shadow:0 2px 0 var(--accent2);}
  .btn.primary:hover{background:var(--accent2);}
  .btn.primary:active{transform:translateY(2px);box-shadow:0 0 0 var(--accent2);}
  .btn.ghost{color:var(--text);background:var(--panel);border:1px solid var(--line2);}
  .btn.ghost:hover{border-color:var(--accent);color:var(--accent);}
  .btn.ghost:active{transform:translateY(1px);}
  .btn.grpL{color:#fff;background:var(--accent);border:none;box-shadow:0 2px 0 var(--accent2);}
  .btn.grpL:hover{background:var(--accent2);}
  .btn.grpL:active{transform:translateY(2px);box-shadow:0 0 0 var(--accent2);}
  .btn.grpR{color:var(--text);background:var(--panel);border:1px solid var(--line2);box-shadow:0 1px 0 var(--line2);}
  .btn.grpR:hover{border-color:var(--accent);color:var(--accent);}
  .btn.grpR:active{transform:translateY(1px);box-shadow:0 0 0 var(--line2);}
  .sharerow{display:flex;gap:8px;padding:10px 14px 0;}
  .sharerow .btn{flex:1;text-align:center;}
  .sep{width:1px;height:24px;background:var(--line);margin:0 2px;}

  .stats{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel);}
  .stat{padding:5px 12px;border-right:1px solid var(--line);min-width:66px;}
  .stat:last-child{border-right:none;}
  .stat .v{font-family:var(--mono);font-size:15px;line-height:1;color:var(--ink);}
  .stat .k{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-top:3px;}
  .stat.geo .v{color:var(--accent);} .stat.view .v{color:var(--accent2);}
  .spacer{flex:1 1 auto;}

  .toggle{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;}
  .toggle .lbl{font-size:11px;color:var(--muted);max-width:140px;line-height:1.2;}
  .switch{width:38px;height:21px;border-radius:11px;background:#E3E5E8;position:relative;flex:0 0 auto;border:1px solid var(--line2);transition:background .18s;}
  .switch::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;box-shadow:0 1px 2px #0000002e;transition:transform .18s;}
  .toggle input{display:none;}
  .toggle input:checked + .switch{background:var(--accent);border-color:var(--accent);}
  .toggle input:checked + .switch::after{transform:translateX(17px);background:#fff;}

  .reconnect{position:absolute;top:calc(var(--header-h) + 12px);left:50%;transform:translateX(-50%);z-index:1500;background:#fff;border:1px solid var(--accent);border-radius:10px;padding:10px 14px;display:none;align-items:center;gap:14px;box-shadow:0 12px 32px #1e1f2226;}
  .reconnect.show{display:flex;}
  .reconnect .msg{font-size:13px;color:var(--text);} .reconnect .msg b{color:var(--accent);}

  .main{display:flex;height:calc(100% - var(--header-h));position:relative;}
  #map{flex:1 1 auto;height:100%;background:#F2F3F5;z-index:1;}
  .imgpanel{position:relative;display:none;flex:0 0 var(--img-w);width:var(--img-w);min-width:240px;max-width:82vw;height:100%;background:#ECEEF1;align-items:center;justify-content:center;overflow:hidden;z-index:2;}
  .imgpanel.open{display:flex;}
  .imgsplit{display:none;}
  .imgpanel.open + .imgsplit{display:block;}
  .ip-close{position:absolute;top:10px;right:12px;z-index:6;background:#ffffffe6;border:1px solid var(--line);color:var(--text);font-size:22px;line-height:1;width:32px;height:32px;border-radius:8px;cursor:pointer;box-shadow:0 2px 8px #1e1f221f;}
  .ip-close:hover{color:var(--accent);border-color:var(--accent);}
  .ip-topright{position:absolute;top:10px;right:52px;z-index:6;display:flex;gap:8px;}
  .ip-iconbtn{width:34px;height:32px;border-radius:8px;background:#ffffffe6;border:1px solid var(--line);color:var(--text);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;box-shadow:0 2px 8px #1e1f221f;transition:color .12s,border-color .12s,background .12s;padding:2px 0 1px;}
  .ip-iconbtn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .ip-iconbtn .pct{font:700 7px var(--mono);letter-spacing:.2px;color:var(--dim);line-height:1;}
  .ip-iconbtn:hover .pct{color:inherit;}
  .ip-iconbtn:hover{color:var(--accent);border-color:var(--accent);}
  .ip-iconbtn.ok{background:var(--good);border-color:var(--good);color:#fff;}
  .folder-pop{display:none;position:absolute;bottom:52px;left:12px;z-index:7;max-width:calc(100% - 24px);align-items:flex-end;gap:8px;background:none;border:none;box-shadow:none;padding:0;overflow:visible;}
  .folder-pop .fp-searchbox{flex:none;width:240px;background:var(--panel);border:1px solid var(--line2);border-radius:10px;box-shadow:0 12px 40px #1e1f2233;padding:10px;}
  .folder-pop .fp-results{display:flex;flex-direction:column;align-items:flex-start;gap:6px;max-height:46vh;overflow:auto;scrollbar-width:none;padding-bottom:2px;}
  .folder-pop .fp-results::-webkit-scrollbar{display:none;}
  .folder-pop .fp-hint{font:600 9px var(--mono);letter-spacing:1px;text-transform:uppercase;color:#ffffff;background:#1e1f2299;border-radius:5px;padding:2px 7px;}
  .folder-pop .fp-title{font:600 12px var(--font);color:var(--ink);margin:0 2px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .folder-pop .fp-search{width:100%;box-sizing:border-box;background:var(--panel2);border:1px solid var(--line2);border-radius:6px;font:12px var(--mono);color:var(--text);padding:6px 22px 6px 9px;}
  .folder-pop .fp-search:focus{outline:none;border-color:var(--accent);}
  .folder-pop .xwrap{margin:0;}
  .xwrap{position:relative;display:flex;flex:1;min-width:0;}
  .xwrap input{flex:1;width:100%;padding-right:22px;}
  .xclear{position:absolute;right:2px;top:50%;transform:translateY(-50%);border:none;background:none;color:var(--dim);font-size:14px;line-height:1;cursor:pointer;padding:2px 5px;display:none;}
  .xwrap.has .xclear{display:block;}
  .xclear:hover{color:var(--bad);}
  .folder-pop .fp-tag{font:600 11px var(--font);color:var(--accent2);background:var(--panel);border:1px solid var(--line2);border-radius:6px;padding:4px 10px;cursor:pointer;opacity:.7;box-shadow:0 2px 8px #1e1f221a;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:opacity .12s,border-color .12s;}
  .folder-pop .fp-tag:hover{border-color:var(--accent);opacity:.85;}
  .folder-pop .fp-tag.on{opacity:1;background:var(--accent-tint);border-color:var(--accent);}
  .folder-pop .fp-create{font:600 11px var(--font);color:#fff;background:var(--accent);border:none;border-radius:6px;padding:5px 10px;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .folder-pop .fp-create:hover{background:var(--accent2);}
  .map-tags{position:absolute;left:12px;bottom:14px;z-index:1000;display:flex;flex-direction:column;align-items:flex-start;gap:6px;max-width:280px;max-height:48%;overflow:auto;scrollbar-width:none;}
  .map-tags::-webkit-scrollbar{display:none;}
  .map-tags.filtered .ip-tag{opacity:.35;}
  .map-tags.filtered .ip-tag.on{opacity:1;border-color:var(--accent);background:var(--accent-tint);}
  .ip-arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:6;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:#ffffffe6;color:var(--text);font-size:26px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .12s,color .12s;box-shadow:0 2px 10px #1e1f2226;}
  .ip-arrow:hover{background:var(--accent);color:#fff;border-color:var(--accent);}
  .ip-arrow.left{left:14px;} .ip-arrow.right{right:14px;}
  .ip-info{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:6;max-width:80%;display:flex;align-items:center;gap:10px;background:#ffffffe8;border:1px solid var(--line);padding:5px 8px 5px 12px;border-radius:8px;box-shadow:0 2px 10px #1e1f221f;}
  .ip-info .fn{font-family:var(--font);font-weight:600;font-size:13px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw;}
  .fileinfo-btn{flex:none;background:var(--panel2);border:1px solid var(--line2);color:var(--text);font:600 11px var(--font);padding:3px 9px;border-radius:6px;cursor:pointer;}
  .fileinfo-btn:hover{border-color:var(--accent);color:var(--accent);}
  .fileinfo-pop{position:absolute;top:44px;left:50%;transform:translateX(-50%);z-index:9;display:none;max-width:min(440px,86%);max-height:50vh;overflow:auto;background:#fff;border:1px solid var(--line2);border-radius:10px;padding:8px 4px;box-shadow:0 14px 40px #1e1f2233;user-select:text;}
  .fileinfo-pop .firow{display:flex;gap:10px;padding:4px 12px;font-family:var(--mono);font-size:11.5px;}
  .fileinfo-pop .fik{flex:none;width:74px;color:var(--dim);}
  .fileinfo-pop .fiv{color:var(--text);word-break:break-all;user-select:text;}
  .ip-tagcol{position:absolute;left:12px;bottom:14px;z-index:6;display:flex;flex-direction:column;align-items:flex-start;gap:6px;max-width:44%;}
  .ip-tags{display:flex;flex-direction:column;align-items:flex-start;gap:6px;max-height:38vh;overflow:auto;scrollbar-width:none;max-width:100%;}
  .ip-tags::-webkit-scrollbar{display:none;}
  .ip-tag{font:600 11px var(--font);text-align:left;color:var(--accent2);background:#ffffffe8;border:1px solid var(--line2);border-radius:6px;padding:4px 10px;cursor:pointer;box-shadow:0 2px 8px #1e1f221a;transition:opacity .15s,border-color .12s;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;}
  .ip-tag:hover{border-color:var(--accent);}
  .ip-tags.filtered .ip-tag{opacity:.35;}
  .ip-tags.filtered .ip-tag.on{opacity:1;border-color:var(--accent);background:var(--accent-tint);}
  .ip-tag.clearall{opacity:1!important;color:var(--bad);}
  .ip-tag.clearall:hover{border-color:var(--bad);}
  .ip-tag .tag-x{margin-right:7px;color:var(--faint);font-style:normal;font-weight:700;cursor:pointer;}
  .ip-tag .tag-x:hover{color:var(--bad);}
  .ip-fullbox{position:absolute;right:12px;bottom:14px;z-index:6;}
  .ip-marktools{position:absolute;top:46px;left:12px;z-index:6;display:flex;flex-direction:column;gap:5px;background:#ffffffe8;border:1px solid var(--line);padding:8px 6px;border-radius:10px;max-height:calc(100% - 120px);overflow:auto;scrollbar-width:none;box-shadow:0 4px 16px #1e1f2226;}
  .ip-marktools::-webkit-scrollbar{display:none;}
  .ip-marktools .mk{position:relative;background:var(--panel);border:1px solid var(--line2);color:var(--text);border-radius:8px;cursor:pointer;width:41px;height:38px;display:flex;align-items:center;justify-content:center;}
  .ip-marktools .mk svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .ip-marktools .mk .hk{position:absolute;right:3px;bottom:1px;font:800 11px var(--mono);color:var(--dim);pointer-events:none;}
  .ip-marktools .mk:hover{border-color:var(--accent);color:var(--accent);}
  .ip-marktools .mk.on{background:var(--accent);color:#fff;border-color:var(--accent);}
  .ip-marktools .mk.on .hk{color:#ffffffcc;}
  .ip-marktools .mk.clear{width:auto;padding:0 9px;color:var(--bad);border-color:#EDB5B6;}
  .ip-marktools .mk.clear .hk{position:static;font:600 11px var(--font);color:inherit;margin-left:4px;}
  .ip-marktools .mk.clear svg{width:18px;height:18px;}
  .markpalette{position:absolute;top:46px;left:72px;z-index:7;display:none;flex-direction:column;align-items:center;gap:7px;background:#ffffffec;border:1px solid var(--line);padding:8px 7px;border-radius:11px;box-shadow:0 4px 16px #1e1f2226;}
  .markpalette.show{display:flex;}
  .markpalette .sw{width:24px;height:24px;border-radius:50%;background:var(--c);border:2px solid #00000022;cursor:pointer;padding:0;}
  .markpalette .sw:hover{border-color:#00000044;}
  .markpalette .sw.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent),0 0 8px var(--accent-tint);}
  .markpalette .thick{-webkit-appearance:slider-vertical;appearance:slider-vertical;writing-mode:vertical-lr;direction:rtl;width:22px;height:90px;margin-top:3px;accent-color:var(--accent);cursor:pointer;}
  .tbed{position:absolute;z-index:8;}
  .tbed .tbtext{display:inline-block;min-width:8px;background:#ffffff;border:2px solid #ff3b30;color:#ff3b30;font:600 13px var(--font);line-height:1.15;padding:2px 5px;border-radius:3px;white-space:pre;outline:none;cursor:text;}
  .tbed .tbctrl{position:absolute;left:0;top:-26px;display:flex;align-items:center;gap:3px;background:#fff;border:1px solid var(--line2);border-radius:7px;padding:2px 3px;box-shadow:0 2px 8px #1e1f221f;}
  .tbed .tbctrl button{background:var(--panel2);border:1px solid var(--line2);color:var(--text);font:700 11px var(--font);width:24px;height:20px;border-radius:5px;cursor:pointer;padding:0;}
  .tbed .tbctrl button:hover{border-color:var(--accent);color:var(--accent);}
  .tbed .tbctrl .tbdel{background:var(--bad);border-color:var(--bad);color:#fff;font-size:14px;line-height:1;}
  .tbed .tbctrl .tbdel:hover{background:#b83436;border-color:#b83436;color:#fff;}
  .tbed .tbctrl .tbmove{color:var(--dim);font-size:13px;padding:0 5px;cursor:grab;}
  .tbed .tbctrl .tbmove:active{cursor:grabbing;}
  .projhead{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:1300;display:none;flex-direction:column;align-items:stretch;background:#ffffffee;border:1px solid var(--line2);border-radius:10px;padding:9px 16px;box-shadow:0 6px 24px #1e1f2233;max-width:72%;pointer-events:none;}
  .projhead.show{display:flex;}
  .ph-track{display:none;height:4px;border-radius:3px;background:var(--line);overflow:hidden;margin:0 0 7px;}
  .projhead.loading .ph-track{display:block;}
  .projhead .progress{position:static;display:block;height:100%;width:0;background:var(--accent);border-radius:3px;transition:width .15s;box-shadow:none;}
  .ph-line{font:600 13px var(--font);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ph-name{font-size:14px;}
  .ph-saved{color:var(--muted);font-weight:500;}
  .ph-load{color:var(--accent);}
  .progress{display:none;}

  .splitter{width:7px;flex:0 0 7px;cursor:col-resize;background:var(--line);position:relative;z-index:3;}
  .splitter::after{content:"";position:absolute;inset:0 2px;background:var(--line2);border-radius:2px;}
  .splitter:hover::after{background:var(--accent);}
  .gallery{width:var(--gallery-w);flex:0 0 var(--gallery-w);height:100%;background:var(--panel);display:flex;flex-direction:column;z-index:2;min-width:220px;border-left:1px solid var(--line);}
  .gallery-head{padding:11px 14px 9px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;justify-content:space-between;gap:8px;}
  .gallery-head .title{font-family:var(--font);font-weight:700;font-size:14px;letter-spacing:.4px;text-transform:uppercase;color:var(--ink);}
  .gallery-head .count{font-family:var(--mono);font-size:12px;color:var(--accent2);}
  .controls{padding:8px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:9px;}
  .ctl-row{display:flex;gap:8px;align-items:center;}
  .ctl-row label{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);white-space:nowrap;}
  .ctl-row select{background:var(--panel2);color:var(--text);border:1px solid var(--line2);border-radius:6px;font-family:var(--mono);font-size:11px;padding:4px 8px;cursor:pointer;flex:1;}
  .ctl-row input[type=range]{flex:1;accent-color:var(--accent);}
  .ctl-row input[type=text]{flex:1;background:var(--panel2);color:var(--text);border:1px solid var(--line2);border-radius:6px;font-family:var(--mono);font-size:11px;padding:4px 8px;}
  .ctl-row input[type=text]::placeholder{color:var(--faint);}
  .ctl-row input[type=text]:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-tint);}
  .gallery-body{flex:1 1 auto;overflow-y:auto;padding:10px;}
  .gallery-body::-webkit-scrollbar{width:9px;}
  .gallery-body::-webkit-scrollbar-thumb{background:var(--line2);border-radius:5px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--thumb),1fr));gap:8px;}
  .gal-more{display:block;width:100%;margin:10px 0 4px;padding:9px 0;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;font:600 11px var(--mono);letter-spacing:.4px;color:var(--accent2);cursor:pointer;}
  .gal-more:hover{border-color:var(--accent);color:var(--accent);}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer;transition:border-color .12s,transform .1s,box-shadow .12s;position:relative;}
  .card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 6px 16px #1e1f2214;}
  .card .thumb{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#ECEEF1;}
  .card .ph{width:100%;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;background:#ECEEF1;color:var(--faint);font-family:var(--mono);font-size:9px;}
  .card .meta{padding:5px 7px 6px;}
  .card .fn{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text);}
  .card .sub{font-family:var(--mono);font-size:8.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .card .flag{position:absolute;top:5px;right:5px;background:#ffffffe6;color:var(--bad);font-family:var(--mono);font-size:8px;padding:2px 4px;border-radius:4px;border:1px solid #EDB5B6;}
  .card .hq{position:absolute;top:5px;left:5px;background:#ffffffe6;color:var(--good);font-family:var(--mono);font-size:8px;padding:2px 4px;border-radius:4px;border:1px solid #B7E0C4;}
  .section-label{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin:14px 4px 8px;display:flex;align-items:center;gap:8px;}
  .section-label::after{content:"";height:1px;flex:1;background:var(--line);}
  .section-label:first-child{margin-top:2px;}
  .empty-msg{padding:36px 20px;text-align:center;color:var(--muted);font-size:13px;line-height:1.6;}
  .empty-msg b{color:var(--text);}
  .hint{font-family:var(--mono);font-size:10px;color:var(--muted);}

  .leftstack{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;flex-direction:column;gap:10px;align-items:center;}
  .btnrow{display:flex;gap:8px;}
  .areabtn{font-family:var(--mono);font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--text);background:#ffffffe8;backdrop-filter:blur(8px);border:1px solid var(--line2);border-radius:9px;padding:9px 13px;cursor:pointer;box-shadow:0 8px 24px #1e1f2222;}
  .areabtn:hover{border-color:var(--accent);color:var(--accent);}
  .areabtn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .measure-lbl{background:#fff;color:var(--accent);font-family:var(--mono);font-size:12px;font-weight:700;padding:3px 7px;border:1px solid var(--accent);border-radius:6px;white-space:nowrap;box-shadow:0 4px 14px #1e1f2226;}
  .measure-lbl.leaflet-tooltip-top:before{border-top-color:var(--accent);}
  .datebar{background:#ffffffe8;backdrop-filter:blur(8px);border:1px solid var(--line2);border-radius:11px;padding:11px 15px 13px;width:min(440px,60vw);box-shadow:0 8px 24px #1e1f2222;}
  .datebar.hidden{display:none;}
  .datebar .dhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;}
  .datebar .dhead .t{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);}
  .datebar .dhead .reset{font-family:var(--mono);font-size:10px;color:var(--accent);cursor:pointer;background:none;border:none;}
  .datebar .vals{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;color:var(--accent2);margin-bottom:8px;}
  .slider-wrap{position:relative;height:24px;}
  .slider-track{position:absolute;top:10px;left:0;right:0;height:4px;background:var(--line2);border-radius:2px;}
  .slider-fill{position:absolute;top:10px;height:4px;background:var(--accent);border-radius:2px;}
  .slider-wrap input[type=range]{-webkit-appearance:none;appearance:none;position:absolute;top:0;left:0;width:100%;height:24px;background:none;pointer-events:none;margin:0;}
  .slider-wrap input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;pointer-events:auto;width:17px;height:17px;border-radius:50%;background:var(--accent);border:3px solid #fff;cursor:grab;box-shadow:0 0 0 1px var(--accent),0 1px 4px #1e1f2233;}
  .slider-wrap input[type=range]::-moz-range-thumb{pointer-events:auto;width:13px;height:13px;border-radius:50%;background:var(--accent);border:3px solid #fff;cursor:grab;}

  .cl-bubble{display:flex;align-items:center;justify-content:center;border-radius:50%;background:radial-gradient(circle at 35% 30%,#7782f5,#5865F2);color:#fff;font-family:var(--mono);font-weight:600;border:2px solid #fff;box-shadow:0 0 0 4px #5865F233,0 2px 8px #1e1f2233;cursor:pointer;}
  .leaflet-interactive.photo-dot{cursor:pointer;}

  .hoverview{position:fixed;z-index:1600;display:none;background:#fff;border:1px solid var(--accent);border-radius:10px;padding:5px;box-shadow:0 14px 40px #1e1f2233;pointer-events:none;}
  .hoverview.show{display:block;}
  .hoverview img{display:block;width:min(270px,40vh);height:min(270px,40vh);object-fit:cover;border-radius:6px;background:#ECEEF1;}
  .hoverview .cap{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:5px;text-align:center;max-width:min(270px,40vh);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  @keyframes hlpulse{0%,100%{stroke-opacity:1;}50%{stroke-opacity:.25;}}
  .hl-dot{animation:hlpulse 1.2s ease-in-out infinite;}

  .leaflet-control-layers,.leaflet-bar{background:#fff!important;border:1px solid var(--line2)!important;border-radius:9px!important;box-shadow:0 6px 18px #1e1f2222!important;color:var(--text)!important;}
  .leaflet-control-layers-expanded{padding:9px 12px!important;font-family:var(--font);font-size:13px;}
  .leaflet-bar a{background:#fff!important;color:var(--text)!important;border-bottom:1px solid var(--line)!important;}
  .leaflet-bar a:hover{background:var(--panel2)!important;color:var(--accent)!important;}
  .leaflet-control-attribution{background:#ffffffcc!important;color:var(--dim)!important;font-size:10px;}
  .leaflet-control-attribution a{color:var(--muted)!important;}
  .scalebar{background:#ffffffee;border:1px solid var(--line2);border-radius:8px;padding:6px 14px 6px;box-shadow:0 2px 10px #1e1f221f;pointer-events:none;}
  .scalebar .sb-title{font:600 10px var(--font);color:var(--ink);margin-bottom:3px;}
  .scalebar .sb-bar{display:flex;height:7px;border:1px solid var(--ink);box-sizing:border-box;background:#fff;}
  .scalebar .sb-bar i{display:block;height:100%;}
  .scalebar .sb-bar i.dark{background:var(--ink);}
  .scalebar .sb-bar i.lite{background:#fff;}
  .scalebar .sb-labels{position:relative;height:11px;margin-top:2px;font:600 9px var(--mono);color:var(--ink);}
  .scalebar .sb-labels span{position:absolute;top:0;transform:translateX(-50%);line-height:1;white-space:nowrap;}

  .lightbox{position:fixed;inset:0;z-index:3000;display:none;align-items:center;justify-content:center;background:rgba(28,30,38,.55);backdrop-filter:blur(3px);}
  .lightbox.open{display:flex;animation:fade .15s ease;}
  @keyframes fade{from{opacity:0;}to{opacity:1;}}
  .lb-frame{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line2);border-radius:12px;overflow:hidden;box-shadow:0 30px 80px #1e1f2240;}
  .lb-stage{position:relative;overflow:hidden;background:#ECEEF1;cursor:grab;}
  .lb-stage.panning{cursor:grabbing;}
  .lb-stage img.main{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform;user-select:none;-webkit-user-drag:none;}
  .lb-ref{position:absolute;top:50px;right:12px;border:1px solid var(--line2);border-radius:6px;overflow:hidden;box-shadow:0 6px 18px #1e1f2233;display:none;}
  .lb-ref.show{display:block;}
  .lb-ref img{display:block;}
  .lb-ref .box{position:absolute;border:2px solid var(--accent);background:#5865F222;box-shadow:0 0 0 9999px #1e1f2240;}
  .lb-tools{position:absolute;top:12px;right:12px;z-index:3;display:flex;flex-direction:column;gap:8px;align-items:flex-end;}
  .lb-enhance{font-family:var(--mono);font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:#fff;background:var(--accent);border:none;border-radius:7px;padding:7px 11px;cursor:pointer;box-shadow:0 2px 10px #1e1f2226;}
  .lb-copyloc{font-family:var(--mono);font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--text);background:var(--panel2);border:1px solid var(--line2);border-radius:7px;padding:7px 11px;cursor:pointer;box-shadow:0 2px 10px #1e1f221a;}
  .lb-fullchk{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:#fff;background:var(--accent);border-radius:7px;padding:7px 11px;cursor:pointer;box-shadow:0 2px 10px #1e1f2226;user-select:none;}
  .lb-fullchk input{width:14px;height:14px;accent-color:#fff;cursor:pointer;margin:0;}
  .lb-fullchk.busy{opacity:.65;cursor:wait;}
  .fsview{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:#ECEEF1;z-index:4;}
  .fsview.show{display:flex;}
  .fs-strip{display:flex;align-items:center;justify-content:center;gap:14px;width:100%;height:82vh;overflow:visible;}
  .fs-item{height:16vh;max-width:16vw;object-fit:contain;border-radius:6px;opacity:.42;cursor:pointer;transition:opacity .18s,height .18s;flex:0 0 auto;background:#ECEEF1;}
  .fs-item:hover{opacity:.8;}
  .fs-item.center{height:78vh;max-width:72vw;opacity:1;cursor:default;box-shadow:0 14px 60px #1e1f2240;transform-origin:center center;position:relative;z-index:2;will-change:transform;}
  .fs-cap{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:14px;text-align:center;max-width:80vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .fs-exit{position:absolute;top:18px;right:20px;z-index:5;font-family:var(--mono);font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--text);background:var(--panel2);border:1px solid var(--line2);border-radius:7px;padding:8px 12px;cursor:pointer;}
  .fs-exit:hover{border-color:var(--accent);color:var(--accent);}
  .fsrail{position:absolute;top:0;bottom:0;display:none;flex-direction:column;gap:14px;align-items:center;justify-content:center;z-index:6;padding:2vh 0;pointer-events:auto;}
  .lightbox.fs .fsrail{display:flex;}
  .lightbox.fs{background:rgba(28,30,38,.7);}
  .fsrail img{width:100%;height:24vh;object-fit:cover;border-radius:8px;opacity:.55;cursor:pointer;transition:opacity .15s,border-color .15s;border:1px solid transparent;background:#ECEEF1;}
  .fsrail img:hover{opacity:1;border-color:var(--accent);}
  .lightbox.fs .lb-frame{position:relative;background:transparent;border:0;box-shadow:none;border-radius:0;}
  .lightbox.fs .lb-bar{position:absolute;left:0;right:0;bottom:0;height:auto;padding:12px 18px;border-top:0;background:linear-gradient(0deg,#1e1f22e0,#1e1f2270,transparent);}
  .lb-iconbtn{background:transparent;border:0;color:var(--text);width:34px;height:32px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;}
  .lb-iconbtn:hover{color:var(--accent);}
  .lb-mark{position:absolute;top:0;left:0;z-index:2;pointer-events:none;}
  .lb-ref{z-index:4;}
  .lb-stage.drawing{cursor:crosshair;}
  .lb-textbtn.on{background:var(--accent);color:#fff;border-color:var(--accent);}
  .lb-close{z-index:8;}
  .lb-copyloc:hover{border-color:var(--accent);color:var(--accent);}
  .lb-copyloc.ok{color:var(--good);border-color:var(--good);}
  .lb-enhance:hover{background:var(--accent2);}
  .lb-enhance.done{background:var(--panel2);color:var(--good);border:1px solid var(--line2);cursor:default;box-shadow:none;}
  .lb-enhance.busy{opacity:.7;cursor:wait;}
  .lb-bar{height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-top:1px solid var(--line);gap:12px;}
  .lb-bar .info{min-width:0;}
  .lb-bar .fn{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .lb-bar .sub{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:2px;}
  .lb-bar .nav{display:flex;gap:8px;align-items:center;}
  .lb-zoomtxt{font-family:var(--mono);font-size:10px;color:var(--muted);min-width:42px;text-align:right;}
  .lb-btn{background:var(--panel2);border:1px solid var(--line2);color:var(--text);width:32px;height:32px;border-radius:7px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;}
  .lb-textbtn{background:var(--panel2);border:1px solid var(--line2);color:var(--text);height:32px;padding:0 12px;border-radius:7px;cursor:pointer;font-family:var(--mono);font-size:11px;letter-spacing:.4px;text-transform:uppercase;}
  .lb-textbtn:hover{border-color:var(--accent);color:var(--accent);}
  .lb-btn:hover{border-color:var(--accent);color:var(--accent);}
  .lb-close{position:absolute;top:16px;right:20px;background:none;border:none;color:var(--dim);font-size:30px;cursor:pointer;line-height:1;z-index:2;}
  .lb-close:hover{color:var(--accent);}

  .dropzone{position:fixed;inset:0;z-index:2500;display:none;align-items:center;justify-content:center;background:rgba(255,255,255,.86);border:3px dashed var(--accent);margin:14px;border-radius:18px;font-family:var(--font);font-weight:700;font-size:26px;color:var(--accent);pointer-events:none;}
  .dropzone.show{display:flex;}
  @media (max-width:900px){ .stats{display:none;} }
</style>
</head>
<body>

<header>
  <div class="brand"><div class="mark"></div><h1>Photo<span>Map</span></h1></div>
  <div class="toolbar">
    <button class="btn grpL" id="btnFolder">Open Folder</button>
    <button class="btn grpL" id="btnOpenJson">Open .JSON</button>
    <button class="btn grpL" id="btnSave" title="Changes auto-save onto the loaded .json — click to force an immediate save">Save</button>
    <button class="btn grpL" id="btnSaveAs" title="Choose a new .json to keep this project in (metadata only — no embedded photos)">Save As</button>
    <span class="sep"></span>
    <button class="btn grpR" id="btnClear">Clear</button>
    <button class="btn grpR" id="btnRefresh" title="Re-scan the main photos folder: add what's new, remove what's gone">Refresh</button>
  </div>
  <input id="folderInput" type="file" webkitdirectory directory multiple style="display:none" />
  <input id="origInput" type="file" webkitdirectory directory multiple style="display:none" />
  <input id="jsonInput" type="file" accept="application/json,.json" style="display:none" />
  <div class="stats">
    <div class="stat total"><div class="v" id="stTotal">0</div><div class="k">Photos</div></div>
    <div class="stat geo"><div class="v" id="stGeo">0</div><div class="k">Geotagged</div></div>
    <div class="stat"><div class="v" id="stNo">0</div><div class="k">No Loc</div></div>
    <div class="stat view"><div class="v" id="stView">0</div><div class="k">In View</div></div>
  </div>
  <div class="spacer"></div>
  <label class="toggle"><input type="checkbox" id="showNoGeo" /><span class="switch"></span><span class="lbl">Show photos without location</span></label>
</header>

<div class="reconnect" id="reconnect">
  <span class="msg" id="rcMsg">—</span>
  <button class="btn primary" id="btnReconnect">Load</button>
</div>

<div class="main" id="main">
  <div class="imgpanel" id="imgPanel">
    <div class="lb-stage" id="lbStage">
      <img class="main" id="lbImg" src="" alt="" />
      <canvas class="lb-mark" id="lbMark"></canvas>
      <div class="lb-ref" id="lbRef"><img id="lbRefImg" src="" alt="" /><div class="box" id="lbRefBox"></div></div>
    </div>
    <div class="ip-topright">
      <button class="ip-iconbtn" id="lbCopy" title="Copy current view to clipboard — screen quality (fast)"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg><b class="pct">50%</b></button>
      <button class="ip-iconbtn" id="lbCopyHQ" title="Copy current view to clipboard — full quality (reads the original from disk)"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg><b class="pct">100%</b></button>
      <button class="ip-iconbtn" id="lbDownload" title="Download current view — full quality"><svg viewBox="0 0 24 24"><path d="M12 3v11M7 10l5 5 5-5M5 20h14"/></svg><b class="pct">100%</b></button>
    </div>
    <button class="ip-close" id="lbClose">&times;</button>
    <button class="ip-arrow left" id="lbPrev">&#8249;</button>
    <button class="ip-arrow right" id="lbNext">&#8250;</button>
    <div class="ip-info"><span class="fn" id="lbName">&mdash;</span><button class="fileinfo-btn" id="fileInfoBtn">File info</button></div>
    <div class="fileinfo-pop" id="fileInfo"></div>
    <div class="markpalette" id="markPalette">
      <button class="sw" data-c="#ff3b30" style="--c:#ff3b30" title="Red"></button>
      <button class="sw" data-c="#34c759" style="--c:#34c759" title="Green"></button>
      <button class="sw" data-c="#2d7dff" style="--c:#2d7dff" title="Blue"></button>
      <button class="sw" data-c="#ffffff" style="--c:#ffffff" title="White"></button>
      <button class="sw" data-c="#111111" style="--c:#111111" title="Black"></button>
      <input type="range" id="thickSlider" class="thick" min="1" max="12" value="5" title="Line thickness" />
    </div>
    <div class="ip-marktools">
      <button class="mk" data-tool="pen" title="Pen (P)"><svg viewBox="0 0 24 24"><path d="M4 20l3-.7L19 7.3 16.7 5 5 16.7 4 20z"/></svg><b class="hk">P</b></button>
      <button class="mk" data-tool="poly" title="Line / polyline — double click or right click to finish (L)"><svg viewBox="0 0 24 24"><path d="M4 18L11 9l4 4 5-8"/></svg><b class="hk">L</b></button>
      <button class="mk" data-tool="arrow" title="Arrow (A)"><svg viewBox="0 0 24 24"><path d="M5 19L19 5M19 5h-6M19 5v6"/></svg><b class="hk">A</b></button>
      <button class="mk" data-tool="rect" title="Rectangle — hold Shift for a square (R)"><svg viewBox="0 0 24 24"><rect x="4.5" y="6.5" width="15" height="11"/></svg><b class="hk">R</b></button>
      <button class="mk" data-tool="oval" title="Ellipse — hold Shift for a circle (O)"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="8" ry="6"/></svg><b class="hk">O</b></button>
      <button class="mk" data-tool="text" title="Text box (T)"><svg viewBox="0 0 24 24"><path d="M5 6h14M12 6v12"/></svg><b class="hk">T</b></button>
      <button class="mk" data-tool="erase" title="Eraser (E)"><svg viewBox="0 0 24 24"><path d="M4 15l7-7 6 6-4 4H8zM11 8l6 6"/></svg><b class="hk">E</b></button>
      <button class="mk clear" id="mkClear" title="Remove every markup on this photo"><svg viewBox="0 0 24 24"><path d="M6 7h12M9 7V5h6v2M8 7l1 12h6l1-12"/></svg><b class="hk">Clear</b></button>
    </div>
    <div class="ip-tagcol">
      <div class="ip-tags" id="lbTags"></div>
      <button class="lb-textbtn" id="lbFolder" title="Type to find existing tags or create a new one">Search/add tag &#9652;</button>
    </div>
    <div class="ip-fullbox">
      <label class="lb-fullchk" id="lbFullWrap"><input type="checkbox" id="lbFull" /><span>Full quality</span></label>
    </div>
    <div class="folder-pop" id="folderPop"></div>
    <div class="tbed" id="tbEditor" style="display:none">
      <div class="tbctrl"><button id="tbDel" class="tbdel" title="Delete text box">&times;</button><button id="tbMinus" title="Smaller">A&minus;</button><button id="tbPlus" title="Larger">A+</button><span class="tbmove" id="tbMove" title="Drag to move">&#10021;</span></div>
      <div class="tbtext" id="tbText" contenteditable="true" spellcheck="false"></div>
    </div>
  </div>
  <div class="splitter imgsplit" id="imgSplit"></div>
  <div id="map"></div>
  <div class="progress" id="progress"></div>
  <div class="leftstack" id="leftstack">
    <div class="btnrow"><button class="areabtn" id="areaBtn">Filter area</button><button class="areabtn" id="zoomBtn">Zoom window</button><button class="areabtn" id="measureBtn">Measure</button></div>
    <div class="datebar hidden" id="datebar">
      <div class="dhead"><span class="t">Capture Date Range</span><button class="reset" id="dateReset">Reset</button></div>
      <div class="vals"><span id="dStart">—</span><span id="dEnd">—</span></div>
      <div class="slider-wrap"><div class="slider-track"></div><div class="slider-fill" id="sliderFill"></div>
        <input type="range" id="rangeMin" min="0" max="100" value="0" /><input type="range" id="rangeMax" min="0" max="100" value="100" /></div>
    </div>
  </div>
  <div class="splitter" id="splitter"></div>
  <aside class="gallery">
    <div class="gallery-head"><span class="title">Gallery</span><span class="count" id="galCount">0 shown</span></div>
    <div class="controls">
      <div class="ctl-row"><label for="sortSel">Sort</label>
        <select id="sortSel"><option value="date_desc">Newest first</option><option value="date_asc">Oldest first</option><option value="name">Filename</option><option value="dist">Nearest to center</option></select></div>
      <div class="ctl-row"><label for="nameFilter">Search</label><span class="xwrap"><input type="text" id="nameFilter" placeholder="Search folder or filename" autocomplete="off" /><button class="xclear" type="button" title="Clear search">&times;</button></span></div>
      <div class="ctl-row"><label for="thumbSize">Size</label><input type="range" id="thumbSize" min="64" max="260" value="120" /></div>
    </div>
    <div class="gallery-body" id="galleryBody">
      <div class="empty-msg"><b>No photos loaded.</b><br/>Click <b>Open Folder</b>, or drag a folder onto the window.<br/><br/>
        <span class="hint">Images stay on your device. Only geotagged photos appear on the map.</span></div>
    </div>
  </aside>
</div>

<div class="hoverview" id="hoverview"><img id="hvImg" src="" alt="" /><div class="cap" id="hvCap"></div></div>

<div class="dropzone" id="dropzone">Drop photos or a folder to add</div>

<script src="https://unpkg.com/supercluster@8.0.1/dist/supercluster.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>

<script>
"use strict";

/* config */
const THUMB_PX = 480, THUMB_Q = 0.72;        // gallery + hover
const PREVIEW_PX = 1280, PREVIEW_Q = 0.72;   // viewer default — cached screenshot-quality rendition; full quality is opt-in from disk
const THUMB_VER = 3;                         // bump when rendition sizes change so old photos regenerate organically

/* state */
let photos=[], nextId=1, folderName="";
let sizeIndex=new Map();   // byte size -> kept photo, for de-duplicating overlapping folders on load
let existingPaths=new Map();   // path -> photo already loaded, so re-opening a folder only processes what's new (or heals missing thumbs)
let currentSort="date_desc", showNoGeo=false, nameFilter="";
let tagFilters=new Set();   // active tag filters (folder paths) — photos must be in ALL of them (intersection)
let dateMin=null,dateMax=null,dateLo=null,dateHi=null;
let lightboxList=[], lightboxIndex=0;
let undoStack=[];
let cluster=null;
let saveFileHandle=null, jsonHandle=null, dirHandle=null, loadedJsonName=null, lastSavedAt=null;
let bannerAction=null;
let boxBounds=null,boxRect=null,drawing=false,drawStart=null,tempRect=null,drawMode=null;
let measuring=false, measurePts=[], measureLayer=null;

/* map + layers */
const map=L.map("map",{zoomControl:false,boxZoom:false,attributionControl:false,worldCopyJump:true,maxZoom:24,minZoom:2,zoomSnap:0.25,wheelDebounceTime:35}).setView([20,0],3);

/* USGS-style scale bar on a white pad: alternating black/white segments with 0 / ¼ / ½ / full
   labels. Meters, switching to kilometers once the bar total reaches 1000 m. */
(function(){
  const ctl=L.control({position:"bottomright"}); let el=null;
  ctl.onAdd=function(){ el=L.DomUtil.create("div","scalebar"); el.innerHTML='<div class="sb-title"></div><div class="sb-bar"><i class="dark" style="width:25%"></i><i class="lite" style="width:25%"></i><i class="dark" style="width:50%"></i></div><div class="sb-labels"></div>'; return el; };
  ctl.addTo(map);
  function niceTotal(maxMeters){ const p=Math.pow(10,Math.floor(Math.log10(maxMeters))); for(const m of [4,2,1]){ if(m*p<=maxMeters) return m*p; } return p; }
  function fmt(v,km){ const n=km?v/1000:v; return (Math.round(n*100)/100).toLocaleString(); }
  function updateScale(){
    if(!el) return;
    const y=Math.round(map.getSize().y/2), maxPx=170;
    const maxMeters=map.distance(map.containerPointToLatLng([10,y]),map.containerPointToLatLng([10+maxPx,y]));
    if(!(maxMeters>0)) return;
    const total=niceTotal(maxMeters), km=total>=1000;
    const px=Math.max(60,Math.round(maxPx*total/maxMeters));
    el.querySelector(".sb-title").textContent=km?"Kilometers":"Meters";
    el.querySelector(".sb-bar").style.width=px+"px";
    const lab=el.querySelector(".sb-labels"); lab.style.width=px+"px";
    lab.innerHTML='<span style="left:0">0</span><span style="left:25%">'+fmt(total/4,km)+'</span><span style="left:50%">'+fmt(total/2,km)+'</span><span style="left:100%">'+fmt(total,km)+'</span>';
  }
  map.on("zoomend moveend resize",updateScale); setTimeout(updateScale,0);   // end-events only — updating per animation frame caused zoom jitter
})();
const markerLayer=L.layerGroup().addTo(map);
const highlightLayer=L.layerGroup().addTo(map);
map.keyboard.disable();
/* Middle-mouse (scroll-wheel button) drag pans the map even while the Zoom window / Filter area /
   Measure tools are active — without changing the active tool. */
(function(){
  const cont=map.getContainer();
  const block=e=>{ if(e.button===1){ e.preventDefault(); e.stopPropagation(); } };
  cont.addEventListener("mousedown",block,true);
  cont.addEventListener("auxclick",block,true);
  cont.addEventListener("pointerdown",e=>{
    if(e.button!==1) return;
    e.preventDefault(); e.stopPropagation();
    let mx=e.clientX,my=e.clientY;
    const prevCursor=cont.style.cursor; cont.style.cursor="grabbing";
    const mv=ev=>{ map.panBy([mx-ev.clientX,my-ev.clientY],{animate:false}); mx=ev.clientX; my=ev.clientY; };
    const up=ev=>{ if(ev.button!==1) return; window.removeEventListener("pointermove",mv); window.removeEventListener("pointerup",up); cont.style.cursor=prevCursor; };
    window.addEventListener("pointermove",mv); window.addEventListener("pointerup",up);
  },true);
})();

/* proximity clustering */
// Shared search predicate (folder path + filename; space-separated terms are AND) used by
// both the map clustering and the gallery so the map only shows dots for the search results.
function passSearch(p){
  if(!nameFilter) return true;
  const terms=nameFilter.split(/\s+/).filter(Boolean); if(!terms.length) return true;
  const hay=((Array.isArray(p.paths)&&p.paths.length?p.paths.join(" "):(p.path||""))+" "+(p.name||"")).toLowerCase();
  return terms.every(t=>hay.includes(t));
}
// Multi-tag filter: a photo passes only if it is in EVERY active tag (overlap/intersection).
function passTags(p){ if(!tagFilters.size) return true; for(const f of tagFilters) if(!photoInFolder(p,f)) return false; return true; }
function buildCluster(){
  const feats=photos.filter(p=>p.lat!=null && passDate(p) && passSearch(p) && passTags(p) && (!boxBounds||boxBounds.contains([p.lat,p.lng]))).map(p=>({type:"Feature",properties:{pid:p.id},geometry:{type:"Point",coordinates:[p.lng,p.lat]}}));
  cluster=new Supercluster({radius:64,maxZoom:21,minPoints:2});
  cluster.load(feats);
}
function renderClusters(){
  markerLayer.clearLayers();
  if(!cluster) return;
  const b=map.getBounds();
  let w=Math.max(-180,b.getWest()),e=Math.min(180,b.getEast()),s=Math.max(-85,b.getSouth()),n=Math.min(85,b.getNorth());
  const z=Math.round(map.getZoom());
  let cl; try{ cl=cluster.getClusters([w,s,e,n],z); }catch(err){ return; }
  for(const c of cl){
    const [lng,lat]=c.geometry.coordinates;
    if(c.properties.cluster){
      const cnt=c.properties.point_count, size=cnt<10?34:cnt<100?42:cnt<1000?52:62, fs=cnt<100?13:cnt<1000?12:11;
      const icon=L.divIcon({className:"",html:'<div class="cl-bubble" style="width:'+size+'px;height:'+size+'px;font-size:'+fs+'px">'+c.properties.point_count_abbreviated+'</div>',iconSize:[size,size],iconAnchor:[size/2,size/2]});
      const m=L.marker([lat,lng],{icon}); const cid=c.properties.cluster_id;
      m.on("click",()=>{   // zoom to the extent of ALL the photos in this cluster — deep enough that only they fill the view
        try{ const leaves=cluster.getLeaves(cid,Infinity);
          if(leaves.length){
            const bb=L.latLngBounds(leaves.map(f=>[f.geometry.coordinates[1],f.geometry.coordinates[0]]));
            const ez=Math.min(cluster.getClusterExpansionZoom(cid),22);   // zoom at which this cluster actually breaks apart
            let z=map.getBoundsZoom(bb,false,L.point(46,46));             // zoom that fits the photos' extent
            z=Math.min(Math.max(z,ez),22);                                 // never shallower than the break-apart zoom, never past useful tile depth
            map.flyTo(bb.getCenter(),z,{duration:.45});
            return;
          } }catch(err){}
        const ez=Math.min(cluster.getClusterExpansionZoom(cid),map.getMaxZoom()); map.flyTo([lat,lng],ez,{duration:.45});   // fallback
      });
      markerLayer.addLayer(m);
    } else {
      const p=photoById(c.properties.pid); if(!p) continue;
      const hit=L.circleMarker([lat,lng],{renderer:dotRenderer,radius:15,stroke:false,fill:true,fillOpacity:0});
      hit.on("mouseover",e=>showHover(p,e.originalEvent)); hit.on("mousemove",e=>positionHover(e.originalEvent)); hit.on("mouseout",hideHover); hit.on("click",()=>openViewer(p));
      const dot=L.circleMarker([lat,lng],{renderer:dotRenderer,radius:6,color:"#3A41B0",weight:2,fillColor:"#5865F2",fillOpacity:.95,interactive:false});
      markerLayer.addLayer(hit); markerLayer.addLayer(dot);
    }
  }
}

/* file loading */
const IMG_RE=/\.(jpe?g|png|tiff?|heic|heif|webp|gif|bmp)$/i;
const hasFSA="showDirectoryPicker" in window;
document.getElementById("btnFolder").addEventListener("click",openFolder);
document.getElementById("folderInput").addEventListener("change",async e=>{
  const fl=Array.from(e.target.files||[]);
  const items=fl.filter(f=>IMG_RE.test(f.name)).map(f=>({name:f.name,path:f.webkitRelativePath||f.name,getFile:async()=>f}));
  const prevRoot=folderName, hadPhotos=photos.length>0;
  folderName=(fl[0]&&(fl[0].webkitRelativePath||"").split("/")[0])||"folder";
  await ingest(items,true);   // additive + incremental: only new files are processed
  if(hadPhotos && prevRoot===folderName) pruneMissing(folderName,new Set(items.map(it=>it.path)));   // same root reopened -> sync deletions too
});
async function openFolder(){
  if(hasFSA){
    try{
      const prevRoot=folderName, hadPhotos=photos.length>0;
      dirHandle=await window.showDirectoryPicker(); invalidateDirIndex(); await idbSet("dirHandle",dirHandle); folderName=dirHandle.name;
      await loadFromHandle(dirHandle,true,{prune: hadPhotos && (prevRoot===dirHandle.name || !prevRoot)});
    }
    catch(err){ if(err&&err.name==="AbortError")return; console.warn("picker fallback",err); document.getElementById("folderInput").click(); }
  } else { document.getElementById("folderInput").click(); }
}
async function* walkDir(handle,prefix){
  for await (const [name,h] of handle.entries()){
    const path=prefix?prefix+"/"+name:name;
    if(h.kind==="file") yield {handle:h,name,path};
    else if(h.kind==="directory") yield* walkDir(h,path);
  }
}
async function loadFromHandle(handle, append, opts){
  loadNote("Loading — scanning “"+(handle.name||"folder")+"”…");
  const items=[];
  for await (const f of walkDir(handle,"")) if(IMG_RE.test(f.name)){ items.push({name:f.name,path:f.path,getFile:()=>f.handle.getFile()}); if(items.length%200===0) loadNote("Loading — scanning “"+(handle.name||"folder")+"”… "+items.length.toLocaleString()+" photos found"); }
  await ingest(items, append);
  if(opts&&opts.prune){ loadNote("Loading — syncing removed files…"); pruneMissing(handle.name,new Set(items.map(it=>it.path))); loadNote(""); }
}
/* Disk-truth sync: a fresh scan of the root folder is authoritative for PHYSICAL paths. Any stored
   physical path no longer present is removed from that photo — so folder-derived tags disappear for
   a moved/deleted copy — while in-app tags (vpaths) are never touched. A photo whose last physical
   copy vanished is dropped from the map unless it still carries in-app tags. */
function pruneMissing(root, seenRaw){
  const pref=(root||"")+"/";
  const norm=pa=>{ pa=String(pa||""); return pa.startsWith(pref)?pa.slice(pref.length):pa; };
  const seen=new Set(); for(const s of seenRaw) seen.add(norm(s));
  let changed=false, removedPhotos=0;
  for(let i=photos.length-1;i>=0;i--){ const p=photos[i];
    const phys=physPaths(p); if(!phys.length) continue;
    const kept=phys.filter(pa=>seen.has(norm(pa)));
    if(kept.length===phys.length) continue;
    changed=true; p.paths=kept;
    if(kept.length){ if(!kept.includes(p.path)) p.path=kept[0]; }
    else if(!virtPaths(p).length){ photos.splice(i,1); removedPhotos++; }
  }
  if(changed){ rebuildSizeIndex(); buildDateFilter(); buildCluster(); renderClusters(); updateStats(); updateGallery(); persistState(); cacheFullSession(); }
  return removedPhotos;
}
const progress=document.getElementById("progress");
function rebuildSizeIndex(){ sizeIndex=new Map(); existingPaths=new Map(); for(const p of photos){ if(p.size!=null && !sizeIndex.has(p.size)) sizeIndex.set(p.size,p); for(const pa of physPaths(p)) existingPaths.set(pa,p); } }
function addPath(p,path){ if(!path) return; if(!Array.isArray(p.paths)) p.paths=p.path?[p.path]:[]; if(!p.paths.includes(path)) p.paths.push(path); }
/* Project header at the top of the map: the .json name this session is based on, its last-saved
   time, and — while anything is busy — a compact load bar just above the text plus
   "Loading (XX%) — <what is happening>" appended after the title. */
let projHeadEl=null, loadNoteTimer=null, projLoadMsg="";
function renderProjHead(){
  if(!projHeadEl){
    projHeadEl=document.createElement("div"); projHeadEl.className="projhead";
    projHeadEl.innerHTML='<div class="ph-track"></div><div class="ph-line"><span class="ph-name"></span><span class="ph-saved"></span><span class="ph-load"></span></div>';
    map.getContainer().appendChild(projHeadEl);
    const pr=document.getElementById("progress"); if(pr) projHeadEl.querySelector(".ph-track").appendChild(pr);   // the load bar lives just above the header text, sized to the callout
  }
  const has=!!(loadedJsonName||folderName||photos.length||projLoadMsg);
  projHeadEl.classList.toggle("show",has); if(!has) return;
  projHeadEl.querySelector(".ph-name").textContent=loadedJsonName||folderName||"PhotoMap";
  projHeadEl.querySelector(".ph-saved").textContent=lastSavedAt?(" (last saved "+fmtDate(lastSavedAt)+")"):" (not saved yet)";
  projHeadEl.querySelector(".ph-load").textContent=projLoadMsg?(" — "+projLoadMsg):"";
  projHeadEl.classList.toggle("loading",!!projLoadMsg);
}
function loadNote(msg){ projLoadMsg=msg||""; clearTimeout(loadNoteTimer); renderProjHead(); }
function flashLoadNote(msg,ms){ loadNote(msg); loadNoteTimer=setTimeout(()=>loadNote(""),ms||1400); }
async function ingest(items, append){
  if(!items.length){ loadNote(""); alert("No image files found in that drop."); return; }
  const wasEmpty=photos.length===0;
  if(!append) clearAll(false);
  loadNote("Loading (0%) — checking "+items.length.toLocaleString()+" file"+(items.length>1?"s":"")+" for changes");
  rebuildSizeIndex();   // de-dupe new files against everything already loaded (appends, JSON sessions)
  let done=0, lastPct=-1; const total=items.length; progress.style.width="0%";
  let idx=0; const POOL=6;
  async function worker(){ while(idx<items.length){ const it=items[idx++]; try{ await processOne(it); }catch(e){} done++; progress.style.width=(done/total*100).toFixed(1)+"%";
    const pct=Math.round(done/total*100); if(pct!==lastPct){ lastPct=pct; loadNote("Loading ("+pct+"%) — checking files & adding new photos"); } } }
  await Promise.all(Array.from({length:POOL},worker));
  finishLoad(!append || wasEmpty); setTimeout(()=>progress.style.width="0%",600);
  loadNote("");
}
// Generate the cached renditions for a photo we already track (metadata-only .json opened on a
// machine with no image cache): heals grey images on the next Open Folder / Refresh.
async function healRenditions(owner,file){
  if(owner.thumb && owner.tv===THUMB_VER) return;
  owner.file=owner.file||file; owner.isHeic=owner.isHeic||isHeic(file);
  let disp=file; if(owner.isHeic){ try{ disp=await heicToJpegBlob(file,0.82); }catch(e){} }
  const imgs=await makePreviews(disp).catch(()=>({thumb:null,preview:null}));
  if(imgs.thumb){ owner.thumb=imgs.thumb; owner.preview=imgs.preview; owner.tv=THUMB_VER; }
}
async function processOne(it){
  // Incremental load: a file already present (same path) WITH imagery is skipped without even
  // reading it; a known photo missing its thumbnails gets them regenerated (heal).
  if(it.path){ const owner=existingPaths.get(it.path); if(owner){ if(owner.thumb) return; const f=await it.getFile(); await healRenditions(owner,f); return; } }
  const file=await it.getFile();
  const sz=file.size;
  // De-dupe by exact byte size: identical file from an overlapping folder -> keep one pin,
  // just record the extra folder path so it stays searchable under either folder name.
  // The check-and-reserve below runs synchronously (no await between), so it is race-safe
  // across the concurrent worker pool.
  if(sz!=null && sizeIndex.has(sz)){ const owner=sizeIndex.get(sz); addPath(owner,it.path); if(it.path) existingPaths.set(it.path,owner); if(!owner.thumb) await healRenditions(owner,file); return; }
  const p={id:nextId++,path:it.path,name:it.name,file,size:sz,isHeic:false,thumb:null,lat:null,lng:null,time:null,dir:null,marks:[],paths:[it.path],vpaths:[]};
  if(sz!=null) sizeIndex.set(sz,p);
  if(it.path) existingPaths.set(it.path,p);
  photos.push(p);
  try{
    const ex=await exifr.parse(file,{tiff:true,ifd0:true,exif:true,gps:true});
    if(ex){
      if(typeof ex.latitude==="number"&&typeof ex.longitude==="number"){ p.lat=ex.latitude; p.lng=ex.longitude; }
      const d=ex.DateTimeOriginal||ex.CreateDate||ex.ModifyDate; if(d instanceof Date&&!isNaN(d)) p.time=d.getTime();
      if(typeof ex.GPSImgDirection==="number") p.dir=ex.GPSImgDirection;
    }
  }catch(e){}
  p.isHeic=isHeic(file);
  let disp=file;
  if(p.isHeic){ try{ disp=await heicToJpegBlob(file,0.82); }catch(e){} }
  const imgs=await makePreviews(disp).catch(()=>({thumb:null,preview:null}));
  p.thumb=imgs.thumb; p.preview=imgs.preview; p.tv=THUMB_VER;
}
function isHeic(file){ return /\.(heic|heif)$/i.test(file.name||"") || /heic|heif/i.test(file.type||""); }
async function heicToJpegBlob(file,quality){
  if(typeof heic2any==="undefined") throw new Error("heic2any not loaded");
  const out=await heic2any({blob:file,toType:"image/jpeg",quality:quality});
  return Array.isArray(out)?out[0]:out;
}
function makePreviews(file){
  return new Promise(res=>{
    const url=URL.createObjectURL(file); const img=new Image();
    img.onload=()=>{ const thumb=scaleToDataURL(img,THUMB_PX,THUMB_Q); const preview=scaleToDataURL(img,PREVIEW_PX,PREVIEW_Q); URL.revokeObjectURL(url); res({thumb,preview}); };
    img.onerror=()=>{ URL.revokeObjectURL(url); res({thumb:null,preview:null}); };
    img.src=url;
  });
}
function scaleToDataURL(img,max,q){
  const scale=Math.min(1,max/Math.max(img.width,img.height));
  const w=Math.max(1,Math.round(img.width*scale)), h=Math.max(1,Math.round(img.height*scale));
  const c=document.createElement("canvas"); c.width=w; c.height=h; c.getContext("2d").drawImage(img,0,0,w,h);
  try{ return c.toDataURL("image/jpeg",q); }catch(e){ return null; }
}
function finishLoad(refit){ buildDateFilter(); buildCluster(); if(refit) fitToPhotos(); renderClusters(); updateStats(); updateGallery(); persistState(); cacheFullSession(); hideBanner(); }
function fitToPhotos(){
  let geo=photos.filter(p=>p.lat!=null && passDate(p) && (!boxBounds||boxBounds.contains([p.lat,p.lng])));
  if(!geo.length) geo=photos.filter(p=>p.lat!=null);
  if(!geo.length) return;
  const b=L.latLngBounds(geo.map(p=>[p.lat,p.lng]));
  const ne=b.getNorthEast(), sw=b.getSouthWest();
  if(Math.abs(ne.lat-sw.lat)<1e-9 && Math.abs(ne.lng-sw.lng)<1e-9){ map.setView(b.getCenter(),16); return; }
  map.fitBounds(b,{padding:[12,12]});
}

/* drag and drop */
const dz=document.getElementById("dropzone"); let dragDepth=0;
window.addEventListener("dragenter",e=>{e.preventDefault();dragDepth++;dz.classList.add("show");});
window.addEventListener("dragover",e=>e.preventDefault());
window.addEventListener("dragleave",e=>{e.preventDefault();if(--dragDepth<=0)dz.classList.remove("show");});
window.addEventListener("drop",async e=>{
  e.preventDefault();dragDepth=0;dz.classList.remove("show");
  const dt=e.dataTransfer;
  const items=dt.items?Array.from(dt.items):[];
  const useFSA=hasFSA&&items[0]&&items[0].getAsFileSystemHandle;
  const handlePs=useFSA?items.map(it=>it.getAsFileSystemHandle?it.getAsFileSystemHandle():Promise.resolve(null)):null;
  const entries=(!useFSA&&items[0]&&items[0].webkitGetAsEntry)?items.map(it=>it.webkitGetAsEntry()):null;
  const files=Array.from(dt.files||[]);
  if(handlePs){
    const handles=(await Promise.all(handlePs.map(p=>p.catch(()=>null)))).filter(Boolean);
    const dirs=handles.filter(h=>h.kind==="directory"), fileHandles=handles.filter(h=>h.kind==="file");
    if(dirs.length===1&&fileHandles.length===0){ const h=dirs[0]; if(!dirHandle){ dirHandle=h; try{await idbSet("dirHandle",h);}catch(er){} folderName=folderName||h.name; } await loadFromHandle(h,true); return; }
    const out=[];
    for(const h of fileHandles) out.push({name:h.name,path:h.name,getFile:()=>h.getFile()});
    for(const d of dirs){ for await (const f of walkDir(d,d.name)) if(IMG_RE.test(f.name)) out.push({name:f.name,path:f.path,getFile:()=>f.handle.getFile()}); }
    ingest(out.filter(o=>IMG_RE.test(o.name)),true); return;
  }
  if(entries&&entries.some(Boolean)){ ingest(await entriesToItems(entries),true); return; }
  const fl=files.filter(f=>IMG_RE.test(f.name)).map(f=>({name:f.name,path:f.name,getFile:async()=>f})); ingest(fl,true);
});
function entriesToItems(roots){
  roots=(roots||[]).filter(Boolean);
  const out=[];
  const walk=(entry,prefix)=>new Promise(res=>{
    const path=prefix?prefix+"/"+entry.name:entry.name;
    if(entry.isFile){ entry.file(f=>{out.push({name:f.name,path,getFile:async()=>f});res();},()=>res()); }
    else if(entry.isDirectory){ const rd=entry.createReader(); const step=()=>rd.readEntries(async b=>{ if(!b.length){res();return;} await Promise.all(b.map(c=>walk(c,path))); step(); },()=>res()); step(); }
    else res();
  });
  return Promise.all(roots.map(r=>walk(r,""))).then(()=>out.filter(o=>IMG_RE.test(o.name)));
}

/* date filter */
function buildDateFilter(){
  const times=photos.filter(p=>p.time!=null).map(p=>p.time); const bar=document.getElementById("datebar");
  if(times.length<2){ bar.classList.add("hidden"); dateMin=dateMax=dateLo=dateHi=null; return; }
  dateMin=times[0]; dateMax=times[0]; for(const t of times){ if(t<dateMin)dateMin=t; if(t>dateMax)dateMax=t; }
  dateLo=dateMin; dateHi=dateMax; bar.classList.remove("hidden"); syncSliderUI();
}
const rMin=document.getElementById("rangeMin"),rMax=document.getElementById("rangeMax"),sliderFill=document.getElementById("sliderFill");
function pctFromTime(t){ return dateMax===dateMin?0:(t-dateMin)/(dateMax-dateMin)*100; }
function timeFromPct(p){ return dateMin+(dateMax-dateMin)*(p/100); }
function syncSliderUI(){ const lo=pctFromTime(dateLo),hi=pctFromTime(dateHi); rMin.value=lo; rMax.value=hi; sliderFill.style.left=lo+"%"; sliderFill.style.width=(hi-lo)+"%"; document.getElementById("dStart").textContent=fmtDate(dateLo); document.getElementById("dEnd").textContent=fmtDate(dateHi); }
function onSlider(){ let lo=parseFloat(rMin.value),hi=parseFloat(rMax.value); if(lo>hi){const t=lo;lo=hi;hi=t;} dateLo=timeFromPct(lo); dateHi=timeFromPct(hi); syncSliderUI(); buildCluster(); renderClusters(); updateStats(); updateGallery(); persistState(); }
rMin.addEventListener("input",onSlider); rMax.addEventListener("input",onSlider);
document.getElementById("dateReset").addEventListener("click",()=>{ dateLo=dateMin; dateHi=dateMax; syncSliderUI(); buildCluster(); renderClusters(); updateStats(); updateGallery(); persistState(); });
function passDate(p){ if(dateLo==null||p.time==null)return true; return p.time>=dateLo&&p.time<=dateHi; }

/* area (box) filter */
const areaBtn=document.getElementById("areaBtn");
const zoomBtn=document.getElementById("zoomBtn");
areaBtn.addEventListener("click",toggleFilter);
zoomBtn.addEventListener("click",toggleZoom);
function toggleFilter(){ if(boxBounds){ clearArea(); return; } if(drawing&&drawMode==="filter"){ stopDraw(); return; } if(drawing){ stopDraw(); } startDraw("filter"); }
function toggleZoom(){ if(drawing&&drawMode==="zoom"){ stopDraw(); return; } if(drawing){ stopDraw(); } startDraw("zoom"); }
function startDraw(mode){ if(measuring) stopMeasure(); drawing=true; drawMode=mode; map.dragging.disable(); map.getContainer().style.cursor="crosshair"; setAreaBtn(); map.on("mousedown",dDown); }
function stopDraw(){ map.off("mousedown",dDown); map.off("mousemove",dMove); map.off("mouseup",dUp); if(tempRect){map.removeLayer(tempRect);tempRect=null;} drawing=false; drawMode=null; map.dragging.enable(); map.getContainer().style.cursor=""; setAreaBtn(); }
function dDown(e){ if(e.originalEvent&&e.originalEvent.button!==0) return; drawStart=e.latlng; map.on("mousemove",dMove); map.on("mouseup",dUp); }
function dMove(e){ const b=L.latLngBounds(drawStart,e.latlng); if(tempRect)tempRect.setBounds(b); else tempRect=L.rectangle(b,{color:"#5865F2",weight:2,fillColor:"#5865F2",fillOpacity:.08,dashArray:"5 4"}).addTo(map); }
function dUp(e){
  const b=L.latLngBounds(drawStart,e.latlng); const mode=drawMode;
  map.off("mousemove",dMove); map.off("mouseup",dUp);
  if(tempRect){map.removeLayer(tempRect);tempRect=null;}
  const tiny=Math.abs(b.getNorth()-b.getSouth())<1e-7 && Math.abs(b.getEast()-b.getWest())<1e-7;
  if(mode==="zoom"){   // stay armed until Escape
    if(!tiny){
      // Smart zoom: if the window contains photos (under the current filters), zoom to the extent
      // of that cluster; an empty window zooms precisely to what was drawn.
      const inWin=photos.filter(p=>p.lat!=null&&passDate(p)&&passSearch(p)&&passTags(p)&&(!boxBounds||boxBounds.contains([p.lat,p.lng]))&&b.contains([p.lat,p.lng]));
      if(inWin.length) map.fitBounds(L.latLngBounds(inWin.map(p=>[p.lat,p.lng])),{padding:[46,46],maxZoom:20});
      else map.fitBounds(b);
    }
    setAreaBtn(); return;
  }
  map.off("mousedown",dDown); drawing=false; drawMode=null; map.dragging.enable(); map.getContainer().style.cursor="";
  if(tiny){ setAreaBtn(); return; }
  boxBounds=b; boxRect=L.rectangle(b,{color:"#5865F2",weight:2,fill:false,dashArray:"6 4"}).addTo(map);
  setAreaBtn(); buildCluster(); renderClusters(); updateGallery(); persistState();
}
function clearArea(){ if(boxRect){map.removeLayer(boxRect);boxRect=null;} boxBounds=null; setAreaBtn(); buildCluster(); renderClusters(); updateGallery(); persistState(); }
function setAreaBtn(){
  if(boxBounds){ areaBtn.textContent="Clear area [f]"; areaBtn.classList.add("active"); }
  else if(drawing&&drawMode==="filter"){ areaBtn.textContent="Cancel [f]"; areaBtn.classList.add("active"); }
  else { areaBtn.textContent="Filter area [f]"; areaBtn.classList.remove("active"); }
  if(drawing&&drawMode==="zoom"){ zoomBtn.textContent="Cancel [z]"; zoomBtn.classList.add("active"); }
  else { zoomBtn.textContent="Zoom window [z]"; zoomBtn.classList.remove("active"); }
}

measureBtn.addEventListener("click",toggleMeasure);
function setMeasureBtn(){ if(measuring){ measureBtn.textContent="Finish [m]"; measureBtn.classList.add("active"); } else { measureBtn.textContent="Measure [m]"; measureBtn.classList.remove("active"); } }
function toggleMeasure(){ if(measuring){ stopMeasure(); return; } if(drawing) stopDraw(); startMeasure(); }
function startMeasure(){ measuring=true; measurePts=[]; if(measureLayer){map.removeLayer(measureLayer);} measureLayer=L.layerGroup().addTo(map); map.getContainer().style.cursor="crosshair"; map.dragging.disable(); map.doubleClickZoom.disable(); map.on("mouseup",mAdd); map.on("mousemove",mMove); map.on("dblclick",mFinish); setMeasureBtn(); }
function stopMeasure(){ measuring=false; map.off("mouseup",mAdd); map.off("mousemove",mMove); map.off("dblclick",mFinish); map.dragging.enable(); map.doubleClickZoom.enable(); map.getContainer().style.cursor=""; if(measureLayer){ map.removeLayer(measureLayer); measureLayer=null; } measurePts=[]; setMeasureBtn(); }
function mFinish(e){ if(e&&e.originalEvent) L.DomEvent.stop(e.originalEvent); map.off("mouseup",mAdd); map.off("mousemove",mMove); map.off("dblclick",mFinish); map.dragging.enable(); map.doubleClickZoom.enable(); map.getContainer().style.cursor=""; measuring=false; drawMeasure(); setMeasureBtn(); }
function snapOrtho(ll,ref){ const lp=map.latLngToContainerPoint(ref), cp=map.latLngToContainerPoint(ll); if(Math.abs(cp.x-lp.x)>=Math.abs(cp.y-lp.y)) cp.y=lp.y; else cp.x=lp.x; return map.containerPointToLatLng(cp); }
function mAdd(e){ if(!measuring)return; if(e.originalEvent&&e.originalEvent.button!==0) return; let ll=e.latlng; if(e.originalEvent&&e.originalEvent.shiftKey&&measurePts.length) ll=snapOrtho(ll,measurePts[measurePts.length-1]); if(measurePts.length){ const a=map.latLngToContainerPoint(measurePts[measurePts.length-1]),b=map.latLngToContainerPoint(ll); if(Math.hypot(a.x-b.x,a.y-b.y)<6) return; } measurePts.push(ll); drawMeasure(); }
function mMove(e){ if(!measuring||!measurePts.length)return; let ll=e.latlng; if(e.originalEvent&&e.originalEvent.shiftKey) ll=snapOrtho(ll,measurePts[measurePts.length-1]); drawMeasure(ll); }
function fmtDist(m){ return m>=1000?(m/1000).toFixed(2)+" km":Math.round(m)+" m"; }
function drawMeasure(preview){
  if(!measureLayer) return; measureLayer.clearLayers(); if(!measurePts.length) return;
  L.polyline(measurePts,{color:"#5865F2",weight:3,opacity:.95}).addTo(measureLayer);
  const verts=measurePts.map(pt=>L.circleMarker(pt,{radius:4,color:"#5865F2",weight:2,fillColor:"#ffffff",fillOpacity:1}).addTo(measureLayer));
  let total=0; for(let i=1;i<measurePts.length;i++) total+=map.distance(measurePts[i-1],measurePts[i]);
  let labelMk=verts[verts.length-1];
  if(preview){ const last=measurePts[measurePts.length-1]; L.polyline([last,preview],{color:"#5865F2",weight:2,opacity:.8,dashArray:"6 6"}).addTo(measureLayer); labelMk=L.circleMarker(preview,{radius:3,color:"#A9B0F7",weight:2,fillColor:"#ffffff",fillOpacity:1}).addTo(measureLayer); total+=map.distance(last,preview); }
  if(total>0&&labelMk) labelMk.bindTooltip(fmtDist(total),{permanent:true,direction:"top",className:"measure-lbl",offset:[0,-2]}).openTooltip();

function deletePhoto(id){

/* The gallery renders at most `galleryLimit` cards (default 50) — rendering thousands of thumbs at
   once was the big filter-toggle/zoom lag. Scrolling near the bottom (or the Show more button)
   loads the next chunk. Viewer navigation still covers EVERY matching photo. */
const GALLERY_CHUNK=50;
let galleryLimit=GALLERY_CHUNK;
function updateGallery(keepLimit){
  if(!keepLimit) galleryLimit=GALLERY_CHUNK;
  const body=document.getElementById("galleryBody"); if(!photos.length) return;
  const bounds=map.getBounds(), center=map.getCenter();
  const spatial=boxBounds||bounds;
  const passName=p=>passSearch(p)&&passTags(p);   // shared with the map so gallery + dots stay in sync
  let inView=sortPhotos(photos.filter(p=>p.lat!=null&&passDate(p)&&passName(p)&&spatial.contains([p.lat,p.lng])),center);
  let noGeo=showNoGeo?sortPhotos(photos.filter(p=>p.lat==null&&passDate(p)&&passName(p)),center):[];
  /* keep the open viewer pinned to the same photo across re-sorts (lightboxIndex is positional) */
  const openP=lb.classList.contains("open")?lightboxList[lightboxIndex]:null;
  lightboxList=inView.concat(noGeo);
  if(openP){ let i=lightboxList.indexOf(openP); if(i<0){ lightboxList=[openP].concat(lightboxList); i=0; } lightboxIndex=i; }
  const anyImg=photos.some(p=>p.thumb);
  if(!anyImg){
    body.innerHTML='<div class="empty-msg"><b>Locations loaded without images.</b><br/>Open the source folder or a saved .JSON to see thumbnails.</div>';
    document.getElementById("galCount").textContent="0 shown"; document.getElementById("stView").textContent=inView.length; return;
  }
  const inShow=inView.slice(0,galleryLimit);
  const geoShow=showNoGeo?noGeo.slice(0,Math.max(0,galleryLimit-inShow.length)):[];
  const hidden=(inView.length-inShow.length)+((showNoGeo?noGeo.length:0)-geoShow.length);
  let html="";
  if(inView.length) html+='<div class="section-label">On Map ('+inView.length+')</div><div class="grid">'+inShow.map(p=>cardHtml(p,false)).join("")+'</div>';
  if(showNoGeo&&geoShow.length) html+='<div class="section-label">No Location ('+noGeo.length+')</div><div class="grid">'+geoShow.map(p=>cardHtml(p,true)).join("")+'</div>';
  if(hidden>0) html+='<button class="gal-more" id="galMore">Show more ('+hidden.toLocaleString()+' remaining)</button>';
  if(!html) html='<div class="empty-msg"><b>No photos in this view.</b><br/>Pan or zoom the map, widen the date range, or load another folder.</div>';
  body.innerHTML=html;
  body.querySelectorAll(".card").forEach(el=>{ const p=photoById(Number(el.dataset.id)); el.addEventListener("click",()=>openViewer(p)); el.addEventListener("mouseenter",()=>highlightDot(p)); el.addEventListener("mouseleave",highlightCurrent); });
  const more=body.querySelector("#galMore"); if(more) more.addEventListener("click",()=>{ galleryLimit+=GALLERY_CHUNK*2; updateGallery(true); });
  if(!body._moreWired){ body._moreWired=true; body.addEventListener("scroll",()=>{ if(!document.getElementById("galMore")) return; if(body.scrollTop+body.clientHeight>body.scrollHeight-320){ galleryLimit+=GALLERY_CHUNK*2; updateGallery(true); } }); }
  document.getElementById("galCount").textContent=lightboxList.length+" shown";
  document.getElementById("stView").textContent=inView.length;
  renderMapTags();
}
/* p.paths = PHYSICAL locations discovered on disk (pruned against reality on every folder rescan).
   p.vpaths = VIRTUAL tag memberships added in-app (never touched by disk syncs). */
function physPaths(p){ return Array.isArray(p.paths)?p.paths:(p.path?[p.path]:[]); }
function virtPaths(p){ return Array.isArray(p.vpaths)?p.vpaths:[]; }
function pathsOf(p){ const a=physPaths(p), b=virtPaths(p); return b.length?a.concat(b.filter(v=>!a.includes(v))):a; }
function cardHtml(p,isNoGeo){
  const sub=p.time?fmtDate(p.time):(p.lat!=null?fmtCoord(p.lat,p.lng):"no metadata");
  const flag=isNoGeo?'<div class="flag">NO GPS</div>':"";
  const src=p.thumb;
  const img=src?'<img class="thumb" src="'+src+'" loading="lazy" decoding="async" alt="">':'<div class="ph">no image</div>';
  const paths=pathsOf(p); const title=esc(paths.length?paths.join("\n"):p.name);   // all folders this photo was found in
  const dupe=paths.length>1?'<div class="hq" style="left:auto;right:5px;background:#4752C4;color:#fff;border-color:#4752C4" title="In '+paths.length+' folders">\u00D7'+paths.length+'</div>':"";
  return '<div class="card" data-id="'+p.id+'" title="'+title+'">'+flag+dupe+img+'<div class="meta"><div class="fn">'+esc(p.name)+'</div><div class="sub">'+esc(sub)+'</div></div></div>';
}
function sortPhotos(arr,center){ const a=arr.slice();
  if(currentSort==="name") a.sort((x,y)=>x.name.localeCompare(y.name));
  else if(currentSort==="date_asc") a.sort((x,y)=>(x.time||Infinity)-(y.time||Infinity));
  else if(currentSort==="dist"&&center) a.sort((x,y)=>dist(x,center)-dist(y,center));
  else a.sort((x,y)=>(y.time||-Infinity)-(x.time||-Infinity));
  return a;
}
function dist(p,c){ if(p.lat==null)return Infinity; const dx=p.lat-c.lat,dy=p.lng-c.lng; return dx*dx+dy*dy; }

function openViewer(p){

  lightboxIndex=i;

/* The viewer shows the cached screenshot-quality preview by default — instant navigation, no disk
   reads. Full quality is opt-in: ticking the checkbox streams the ORIGINAL from disk (object URL,
   never cached as a copy). */
let fullToken=0;

  const p=lightboxList[lightboxIndex]; if(!p)return;
  if(selMark) deselectText();

/* Tag pills. Clicking toggles that tag in the active filter set — several tags can be active at
   once and photos must be in ALL of them (overlap). Active = full opacity, rest dimmed. Works the
   same from the photo's pills and the map rail. */
function tagPillsHtml(folders, removable){
  let html="";
  for(const f of folders){ const on=tagFilters.has(f);
    html+='<button class="ip-tag'+(on?" on":"")+'" data-folder="'+esc(f)+'" title="'+esc(f)+' — click to filter, × to remove">'+(removable?'<b class="tag-x" title="Remove this tag from the photo">&times;</b>':"")+esc(folderLabel(f))+'</button>'; }
  if(tagFilters.size>1) html+='<button class="ip-tag clearall" title="Remove all tag filters">Clear filters &times;</button>';
  return html;
}
function wireTagPills(el, removable){
  el.querySelectorAll(".ip-tag").forEach(b=>b.addEventListener("click",e=>{ e.stopPropagation();
    if(b.classList.contains("clearall")){ tagFilters.clear(); refreshTagFilter(); return; }
    if(removable && e.target.closest && e.target.closest(".tag-x")){   // the little × removes the tag from THIS photo
      const p=curPhoto(); if(!p) return;
      const before=snapshotTags(p); setPhotoFolder(p,b.dataset.folder,false); recordTagChange(p,before); afterFolderChange(); return;
    }

}
function refreshTagFilter(){ buildCluster(); renderClusters(); updateGallery(); renderPhotoTags(curPhoto()); }

  if(tagFilters.has(folder)) tagFilters.delete(folder); else tagFilters.add(folder);
  refreshTagFilter();

// Original file without prompting: in-memory file, connected-folder index, or a granted FSA handle.
async function getOriginalFileSilent(p){
  if(p.file) return p.file;
  const idx=fromIndex(p); if(idx){ p.file=idx; return idx; }
  if(!dirHandle){ try{ dirHandle=await idbGet("dirHandle"); }catch(e){} }
  try{ if(dirHandle && (await dirHandle.queryPermission({mode:"read"}))==="granted"){ const f=await resolveFromHandle(p); if(f){ p.file=f; return f; } } }catch(e){}
  return null;
}
async function originalToURL(p,file){
  let src=file;
  if(p.isHeic||isHeic(file)){ try{ src=await heicToJpegBlob(file,0.92); }catch(e){} }
  return {url:URL.createObjectURL(src), blob:src};
}
// Photos loaded before a rendition-quality bump keep their old thumbs/previews (incremental load
// skips them); regenerate organically from the original streamed for a full-quality view.
async function maybeUpgradeRenditions(p,blob){
  if(p.tv===THUMB_VER || !blob) return;
  try{ const imgs=await makePreviews(blob); if(imgs.thumb){ p.thumb=imgs.thumb; p.preview=imgs.preview||p.preview; p.tv=THUMB_VER; cacheFullSession(); } }catch(e){}
}
async function showFull(p){
  const tok=++fullToken;
  const stay=()=>lightboxList[lightboxIndex]===p && tok===fullToken && lb.classList.contains("open");
  let file=null; try{ file=await getOriginalFileSilent(p); }catch(e){}
  if(!file){ file=await fetchOriginal(p); if(file) p.file=file; }
  if(!file) return false;
  const r=await originalToURL(p,file);
  if(stay()){ swapViewer(r.url); maybeUpgradeRenditions(p,r.blob); }

}

  lbMark.width=fitW; lbMark.height=fitH; lbMark.style.width=fitW+"px"; lbMark.style.height=fitH+"px"; redrawMarks(); if(selMark) positionEditor();
  const refH=Math.round(REF_W*fitH/fitW); lbRef.style.width=REF_W+"px"; lbRef.style.height=refH+"px"; lbRefImg.style.width=REF_W+"px"; lbRefImg.style.height=refH+"px";
