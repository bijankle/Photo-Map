<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PhotoMap</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>
  :root{
    --bg:#ffffff; --panel:#ffffff; --panel2:#F8F9FB; --line:#E3E5E8; --line2:#C7CAD1;
    --text:#2E3035; --ink:#1E1F22; --muted:#5C5E66; --dim:#80848E; --faint:#9A9DA5;
    --accent:#5865F2; --accent2:#4752C4; --accent-tint:#EEF0FE; --good:#3BA55C; --bad:#D83C3E;
    --font:'Aptos','Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,sans-serif;
    --mono:'Aptos Mono','Cascadia Code',ui-monospace,monospace;
    --header-h:58px; --gallery-w:360px; --thumb:120px; --img-w:42%;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{background:var(--bg);color:var(--text);font-family:var(--font);overflow:hidden;-webkit-font-smoothing:antialiased;}
  ::selection{background:#D9DDFB;}

  header{height:var(--header-h);display:flex;align-items:center;gap:14px;padding:0 16px;
    background:var(--panel);border-bottom:1px solid var(--line);position:relative;z-index:1200;}
  .brand{display:flex;align-items:center;gap:9px;flex:0 0 auto;}
  .brand .mark{width:24px;height:24px;border-radius:6px;position:relative;background:radial-gradient(circle at 35% 30%,var(--accent),var(--accent2));box-shadow:0 1px 4px #5865F255;}
  .brand .mark::after{content:"";position:absolute;inset:0;margin:auto;width:6px;height:6px;border-radius:50%;background:#fff;}
  .brand h1{font-family:var(--font);font-weight:700;font-size:17px;margin:0;color:var(--ink);}
  .brand h1 span{color:var(--accent);}

  .toolbar{display:flex;gap:6px;align-items:center;}
  .btn{font-family:var(--mono);font-size:11px;letter-spacing:.4px;text-transform:uppercase;border-radius:7px;padding:8px 11px;cursor:pointer;transition:all .12s ease;white-space:nowrap;}
  .btn.primary{color:#fff;background:var(--accent);border:none;box-shadow:0 2px 0 var(--accent2);}
  .btn.primary:hover{background:var(--accent2);}
  .btn.primary:active{transform:translateY(2px);box-shadow:0 0 0 var(--accent2);}
  .btn.ghost{color:var(--text);background:var(--panel);border:1px solid var(--line2);}
  .btn.ghost:hover{border-color:var(--accent);color:var(--accent);}
  .btn.ghost:active{transform:translateY(1px);}
  .btn.grpL{color:#fff;background:var(--accent);border:none;box-shadow:0 2px 0 var(--accent2);}
  .btn.grpL:hover{background:var(--accent2);}
  .btn.grpL:active{transform:translateY(2px);box-shadow:0 0 0 var(--accent2);}
  .btn.grpR{color:var(--text);background:var(--panel);border:1px solid var(--line2);box-shadow:0 1px 0 var(--line2);}
  .btn.grpR:hover{border-color:var(--accent);color:var(--accent);}
  .btn.grpR:active{transform:translateY(1px);box-shadow:0 0 0 var(--line2);}
  .sharerow{display:flex;gap:8px;padding:10px 14px 0;}
  .sharerow .btn{flex:1;text-align:center;}
  .sep{width:1px;height:24px;background:var(--line);margin:0 2px;}

  .stats{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel);}
  .stat{padding:5px 12px;border-right:1px solid var(--line);min-width:66px;}
  .stat:last-child{border-right:none;}
  .stat .v{font-family:var(--mono);font-size:15px;line-height:1;color:var(--ink);}
  .stat .k{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-top:3px;}
  .stat.geo .v{color:var(--accent);} .stat.view .v{color:var(--accent2);}
  .spacer{flex:1 1 auto;}

  .toggle{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;}
  .toggle .lbl{font-size:11px;color:var(--muted);max-width:140px;line-height:1.2;}
  .switch{width:38px;height:21px;border-radius:11px;background:#E3E5E8;position:relative;flex:0 0 auto;border:1px solid var(--line2);transition:background .18s;}
  .switch::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;box-shadow:0 1px 2px #0000002e;transition:transform .18s;}
  .toggle input{display:none;}
  .toggle input:checked + .switch{background:var(--accent);border-color:var(--accent);}
  .toggle input:checked + .switch::after{transform:translateX(17px);background:#fff;}

  .reconnect{position:absolute;top:calc(var(--header-h) + 12px);left:50%;transform:translateX(-50%);z-index:1500;background:#fff;border:1px solid var(--accent);border-radius:10px;padding:10px 14px;display:none;align-items:center;gap:14px;box-shadow:0 12px 32px #1e1f2226;}
  .reconnect.show{display:flex;}
  .reconnect .msg{font-size:13px;color:var(--text);} .reconnect .msg b{color:var(--accent);}

  .main{display:flex;height:calc(100% - var(--header-h));position:relative;}
  #map{flex:1 1 auto;height:100%;background:#F2F3F5;z-index:1;}
  .imgpanel{position:relative;display:none;flex:0 0 var(--img-w);width:var(--img-w);min-width:240px;max-width:82vw;height:100%;background:#ECEEF1;align-items:center;justify-content:center;overflow:hidden;z-index:2;}
  .imgpanel.open{display:flex;}
  .imgsplit{display:none;}
  .imgpanel.open + .imgsplit{display:block;}
  .ip-close{position:absolute;top:10px;right:12px;z-index:6;background:#ffffffe6;border:1px solid var(--line);color:var(--text);font-size:22px;line-height:1;width:32px;height:32px;border-radius:8px;cursor:pointer;box-shadow:0 2px 8px #1e1f221f;}
  .ip-close:hover{color:var(--accent);border-color:var(--accent);}
  .ip-arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:6;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:#ffffffe6;color:var(--text);font-size:26px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .12s,color .12s;box-shadow:0 2px 10px #1e1f2226;}
  .ip-arrow:hover{background:var(--accent);color:#fff;border-color:var(--accent);}
  .ip-arrow.left{left:14px;} .ip-arrow.right{right:14px;}
  .ip-info{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:6;max-width:80%;display:flex;align-items:center;gap:10px;background:#ffffffe8;border:1px solid var(--line);padding:5px 8px 5px 12px;border-radius:8px;box-shadow:0 2px 10px #1e1f221f;}
  .ip-info .fn{font-family:var(--font);font-weight:600;font-size:13px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw;}
  .fileinfo-btn{flex:none;background:var(--panel2);border:1px solid var(--line2);color:var(--text);font:600 11px var(--font);padding:3px 9px;border-radius:6px;cursor:pointer;}
  .fileinfo-btn:hover{border-color:var(--accent);color:var(--accent);}
  .fileinfo-pop{position:absolute;top:44px;left:50%;transform:translateX(-50%);z-index:9;display:none;max-width:min(440px,86%);max-height:50vh;overflow:auto;background:#fff;border:1px solid var(--line2);border-radius:10px;padding:8px 4px;box-shadow:0 14px 40px #1e1f2233;user-select:text;}
  .fileinfo-pop .firow{display:flex;gap:10px;padding:4px 12px;font-family:var(--mono);font-size:11.5px;}
  .fileinfo-pop .fik{flex:none;width:74px;color:var(--dim);}
  .fileinfo-pop .fiv{color:var(--text);word-break:break-all;user-select:text;}
  .ip-tools{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);z-index:6;display:flex;align-items:center;gap:8px;background:#ffffffe8;border:1px solid var(--line);padding:7px 10px;border-radius:10px;box-shadow:0 4px 16px #1e1f2226;}
  .ip-marktools{position:absolute;top:46px;left:50%;transform:translateX(-50%);z-index:6;display:flex;flex-wrap:wrap;justify-content:center;gap:5px;background:#ffffffe8;border:1px solid var(--line);padding:6px 8px;border-radius:10px;max-width:90%;box-shadow:0 4px 16px #1e1f2226;}
  .ip-marktools .mk{position:relative;background:var(--panel);border:1px solid var(--line2);color:var(--text);border-radius:8px;cursor:pointer;width:41px;height:38px;display:flex;align-items:center;justify-content:center;}
  .ip-marktools .mk svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .ip-marktools .mk .hk{position:absolute;right:3px;bottom:1px;font:800 11px var(--mono);color:var(--dim);pointer-events:none;}
  .ip-marktools .mk:hover{border-color:var(--accent);color:var(--accent);}
  .ip-marktools .mk.on{background:var(--accent);color:#fff;border-color:var(--accent);}
  .ip-marktools .mk.on .hk{color:#ffffffcc;}
  .ip-marktools .mk.clear{width:auto;padding:0 9px;color:var(--bad);border-color:#EDB5B6;}
  .ip-marktools .mk.clear .hk{position:static;font:600 11px var(--font);color:inherit;margin-left:4px;}
  .ip-marktools .mk.clear svg{width:18px;height:18px;}
  .markpalette{position:absolute;top:46px;left:12px;z-index:7;display:none;flex-direction:column;align-items:center;gap:7px;background:#ffffffec;border:1px solid var(--line);padding:8px 7px;border-radius:11px;box-shadow:0 4px 16px #1e1f2226;}
  .markpalette.show{display:flex;}
  .markpalette .sw{width:24px;height:24px;border-radius:50%;background:var(--c);border:2px solid #00000022;cursor:pointer;padding:0;}
  .markpalette .sw:hover{border-color:#00000044;}
  .markpalette .sw.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent),0 0 8px var(--accent-tint);}
  .markpalette .thick{-webkit-appearance:slider-vertical;appearance:slider-vertical;writing-mode:vertical-lr;direction:rtl;width:22px;height:90px;margin-top:3px;accent-color:var(--accent);cursor:pointer;}
  .tbed{position:absolute;z-index:8;}
  .tbed .tbtext{display:inline-block;min-width:8px;background:#ffffff;border:2px solid #ff3b30;color:#ff3b30;font:600 13px var(--font);line-height:1.15;padding:2px 5px;border-radius:3px;white-space:pre;outline:none;cursor:text;}
  .tbed .tbctrl{position:absolute;left:0;top:-26px;display:flex;align-items:center;gap:3px;background:#fff;border:1px solid var(--line2);border-radius:7px;padding:2px 3px;box-shadow:0 2px 8px #1e1f221f;}
  .tbed .tbctrl button{background:var(--panel2);border:1px solid var(--line2);color:var(--text);font:700 11px var(--font);width:24px;height:20px;border-radius:5px;cursor:pointer;padding:0;}
  .tbed .tbctrl button:hover{border-color:var(--accent);color:var(--accent);}
  .tbed .tbctrl .tbdel{background:var(--bad);border-color:var(--bad);color:#fff;font-size:14px;line-height:1;}
  .tbed .tbctrl .tbdel:hover{background:#b83436;border-color:#b83436;color:#fff;}
  .tbed .tbctrl .tbmove{color:var(--dim);font-size:13px;padding:0 5px;cursor:grab;}
  .tbed .tbctrl .tbmove:active{cursor:grabbing;}
  .progress{position:absolute;top:0;left:0;height:3px;background:var(--accent);width:0;z-index:1300;box-shadow:0 0 8px var(--accent);transition:width .2s;}

  .splitter{width:7px;flex:0 0 7px;cursor:col-resize;background:var(--line);position:relative;z-index:3;}
  .splitter::after{content:"";position:absolute;inset:0 2px;background:var(--line2);border-radius:2px;}
  .splitter:hover::after{background:var(--accent);}
  .gallery{width:var(--gallery-w);flex:0 0 var(--gallery-w);height:100%;background:var(--panel);display:flex;flex-direction:column;z-index:2;min-width:220px;border-left:1px solid var(--line);}
  .gallery-head{padding:11px 14px 9px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;justify-content:space-between;gap:8px;}
  .gallery-head .title{font-family:var(--font);font-weight:700;font-size:14px;letter-spacing:.4px;text-transform:uppercase;color:var(--ink);}
  .gallery-head .count{font-family:var(--mono);font-size:12px;color:var(--accent2);}
  .controls{padding:8px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:9px;}
  .ctl-row{display:flex;gap:8px;align-items:center;}
  .ctl-row label{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);white-space:nowrap;}
  .ctl-row select{background:var(--panel2);color:var(--text);border:1px solid var(--line2);border-radius:6px;font-family:var(--mono);font-size:11px;padding:4px 8px;cursor:pointer;flex:1;}
  .ctl-row input[type=range]{flex:1;accent-color:var(--accent);}
  .ctl-row input[type=text]{flex:1;background:var(--panel2);color:var(--text);border:1px solid var(--line2);border-radius:6px;font-family:var(--mono);font-size:11px;padding:4px 8px;}
  .ctl-row input[type=text]::placeholder{color:var(--faint);}
  .ctl-row input[type=text]:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-tint);}
  .gallery-body{flex:1 1 auto;overflow-y:auto;padding:10px;}
  .gallery-body::-webkit-scrollbar{width:9px;}
  .gallery-body::-webkit-scrollbar-thumb{background:var(--line2);border-radius:5px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--thumb),1fr));gap:8px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer;transition:border-color .12s,transform .1s,box-shadow .12s;position:relative;}
  .card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 6px 16px #1e1f2214;}
  .card .thumb{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#ECEEF1;}
  .card .ph{width:100%;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;background:#ECEEF1;color:var(--faint);font-family:var(--mono);font-size:9px;}
  .card .meta{padding:5px 7px 6px;}
  .card .fn{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text);}
  .card .sub{font-family:var(--mono);font-size:8.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .card .flag{position:absolute;top:5px;right:5px;background:#ffffffe6;color:var(--bad);font-family:var(--mono);font-size:8px;padding:2px 4px;border-radius:4px;border:1px solid #EDB5B6;}
  .card .hq{position:absolute;top:5px;left:5px;background:#ffffffe6;color:var(--good);font-family:var(--mono);font-size:8px;padding:2px 4px;border-radius:4px;border:1px solid #B7E0C4;}
  .section-label{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin:14px 4px 8px;display:flex;align-items:center;gap:8px;}
  .section-label::after{content:"";height:1px;flex:1;background:var(--line);}
  .section-label:first-child{margin-top:2px;}
  .empty-msg{padding:36px 20px;text-align:center;color:var(--muted);font-size:13px;line-height:1.6;}
  .empty-msg b{color:var(--text);}
  .hint{font-family:var(--mono);font-size:10px;color:var(--muted);}

  .leftstack{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;flex-direction:column;gap:10px;align-items:center;}
  .btnrow{display:flex;gap:8px;}
  .areabtn{font-family:var(--mono);font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--text);background:#ffffffe8;backdrop-filter:blur(8px);border:1px solid var(--line2);border-radius:9px;padding:9px 13px;cursor:pointer;box-shadow:0 8px 24px #1e1f2222;}
  .areabtn:hover{border-color:var(--accent);color:var(--accent);}
  .areabtn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .measure-lbl{background:#fff;color:var(--accent);font-family:var(--mono);font-size:12px;font-weight:700;padding:3px 7px;border:1px solid var(--accent);border-radius:6px;white-space:nowrap;box-shadow:0 4px 14px #1e1f2226;}
  .measure-lbl.leaflet-tooltip-top:before{border-top-color:var(--accent);}
  .datebar{background:#ffffffe8;backdrop-filter:blur(8px);border:1px solid var(--line2);border-radius:11px;padding:11px 15px 13px;width:min(440px,60vw);box-shadow:0 8px 24px #1e1f2222;}
  .datebar.hidden{display:none;}
  .datebar .dhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;}
  .datebar .dhead .t{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);}
  .datebar .dhead .reset{font-family:var(--mono);font-size:10px;color:var(--accent);cursor:pointer;background:none;border:none;}
  .datebar .vals{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;color:var(--accent2);margin-bottom:8px;}
  .slider-wrap{position:relative;height:24px;}
  .slider-track{position:absolute;top:10px;left:0;right:0;height:4px;background:var(--line2);border-radius:2px;}
  .slider-fill{position:absolute;top:10px;height:4px;background:var(--accent);border-radius:2px;}
  .slider-wrap input[type=range]{-webkit-appearance:none;appearance:none;position:absolute;top:0;left:0;width:100%;height:24px;background:none;pointer-events:none;margin:0;}
  .slider-wrap input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;pointer-events:auto;width:17px;height:17px;border-radius:50%;background:var(--accent);border:3px solid #fff;cursor:grab;box-shadow:0 0 0 1px var(--accent),0 1px 4px #1e1f2233;}
  .slider-wrap input[type=range]::-moz-range-thumb{pointer-events:auto;width:13px;height:13px;border-radius:50%;background:var(--accent);border:3px solid #fff;cursor:grab;}

  .cl-bubble{display:flex;align-items:center;justify-content:center;border-radius:50%;background:radial-gradient(circle at 35% 30%,#7782f5,#5865F2);color:#fff;font-family:var(--mono);font-weight:600;border:2px solid #fff;box-shadow:0 0 0 4px #5865F233,0 2px 8px #1e1f2233;cursor:pointer;}
  .leaflet-interactive.photo-dot{cursor:pointer;}

  .hoverview{position:fixed;z-index:1600;display:none;background:#fff;border:1px solid var(--accent);border-radius:10px;padding:5px;box-shadow:0 14px 40px #1e1f2233;pointer-events:none;}
  .hoverview.show{display:block;}
  .hoverview img{display:block;width:min(270px,40vh);height:min(270px,40vh);object-fit:cover;border-radius:6px;background:#ECEEF1;}
  .hoverview .cap{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:5px;text-align:center;max-width:min(270px,40vh);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  @keyframes hlpulse{0%,100%{stroke-opacity:1;}50%{stroke-opacity:.25;}}
  .hl-dot{animation:hlpulse 1.2s ease-in-out infinite;}

  .leaflet-control-layers,.leaflet-bar{background:#fff!important;border:1px solid var(--line2)!important;border-radius:9px!important;box-shadow:0 6px 18px #1e1f2222!important;color:var(--text)!important;}
  .leaflet-control-layers-expanded{padding:9px 12px!important;font-family:var(--font);font-size:13px;}
  .leaflet-bar a{background:#fff!important;color:var(--text)!important;border-bottom:1px solid var(--line)!important;}
  .leaflet-bar a:hover{background:var(--panel2)!important;color:var(--accent)!important;}
  .leaflet-control-attribution{background:#ffffffcc!important;color:var(--dim)!important;font-size:10px;}
  .leaflet-control-attribution a{color:var(--muted)!important;}

  .lightbox{position:fixed;inset:0;z-index:3000;display:none;align-items:center;justify-content:center;background:rgba(28,30,38,.55);backdrop-filter:blur(3px);}
  .lightbox.open{display:flex;animation:fade .15s ease;}
  @keyframes fade{from{opacity:0;}to{opacity:1;}}
  .lb-frame{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line2);border-radius:12px;overflow:hidden;box-shadow:0 30px 80px #1e1f2240;}
  .lb-stage{position:relative;overflow:hidden;background:#ECEEF1;cursor:grab;}
  .lb-stage.panning{cursor:grabbing;}
  .lb-stage img.main{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform;user-select:none;-webkit-user-drag:none;}
  .lb-ref{position:absolute;top:12px;left:12px;border:1px solid var(--line2);border-radius:6px;overflow:hidden;box-shadow:0 6px 18px #1e1f2233;display:none;}
  .lb-ref.show{display:block;}
  .lb-ref img{display:block;}
  .lb-ref .box{position:absolute;border:2px solid var(--accent);background:#5865F222;box-shadow:0 0 0 9999px #1e1f2240;}
  .lb-tools{position:absolute;top:12px;right:12px;z-index:3;display:flex;flex-direction:column;gap:8px;align-items:flex-end;}
  .lb-enhance{font-family:var(--mono);font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:#fff;background:var(--accent);border:none;border-radius:7px;padding:7px 11px;cursor:pointer;box-shadow:0 2px 10px #1e1f2226;}
  .lb-copyloc{font-family:var(--mono);font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--text);background:var(--panel2);border:1px solid var(--line2);border-radius:7px;padding:7px 11px;cursor:pointer;box-shadow:0 2px 10px #1e1f221a;}
  .lb-fullchk{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:#fff;background:var(--accent);border-radius:7px;padding:7px 11px;cursor:pointer;box-shadow:0 2px 10px #1e1f2226;user-select:none;}
  .lb-fullchk input{width:14px;height:14px;accent-color:#fff;cursor:pointer;margin:0;}

  .lb-del{font-family:var(--mono);font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--bad);background:var(--panel2);border:1px solid #EDB5B6;border-radius:7px;padding:7px 11px;cursor:pointer;box-shadow:0 2px 10px #1e1f221a;}

  .fs-item{height:16vh;max-width:16vw;object-fit:contain;border-radius:6px;opacity:.42;cursor:pointer;transition:opacity .18s,height .18s;flex:0 0 auto;background:#ECEEF1;}

  .fs-exit{position:absolute;top:18px;right:20px;z-index:5;font-family:var(--mono);font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--text);background:var(--panel2);border:1px solid var(--line2);border-radius:7px;padding:8px 12px;cursor:pointer;}

  .fsrail{position:absolute;top:0;bottom:0;display:none;flex-direction:column;gap:14px;align-items:center;justify-content:center;z-index:6;padding:2vh 0;pointer-events:auto;}

  .cardel{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:5px;border:1px solid var(--line);background:#ffffffe0;color:var(--bad);font-size:14px;line-height:1;cursor:pointer;display:none;align-items:center;justify-content:center;z-index:3;padding:0;}
  .card:hover .cardel{display:flex;}

  .lb-copyloc:hover{border-color:var(--accent);color:var(--accent);}

  .lb-bar .info{min-width:0;}
  .lb-bar .fn{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .lb-bar .sub{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:2px;}

  .lb-btn{background:var(--panel2);border:1px solid var(--line2);color:var(--text);width:32px;height:32px;border-radius:7px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;}
  .lb-textbtn{background:var(--panel2);border:1px solid var(--line2);color:var(--text);height:32px;padding:0 12px;border-radius:7px;cursor:pointer;font-family:var(--mono);font-size:11px;letter-spacing:.4px;text-transform:uppercase;}

</style>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/supercluster@8.0.1/dist/supercluster.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>

<script>
"use strict";

/* config */
const THUMB_PX = 200;     // gallery + hover
const PREVIEW_PX = 1024;  // embedded zoom preview

/* state */
let photos=[], nextId=1, folderName="";
let sizeIndex=new Map();   // byte size -> kept photo, for de-duplicating overlapping folders on load
let currentSort="date_desc", showNoGeo=false, nameFilter="";
let dateMin=null,dateMax=null,dateLo=null,dateHi=null;
let lightboxList=[], lightboxIndex=0;
let undoStack=[];
let cluster=null;
let saveFileHandle=null, jsonHandle=null, dirHandle=null;
let bannerAction=null;
let boxBounds=null,boxRect=null,drawing=false,drawStart=null,tempRect=null,drawMode=null;
let measuring=false, measurePts=[], measureLayer=null;

/* map + layers */
const map=L.map("map",{zoomControl:false,boxZoom:false,worldCopyJump:true,maxZoom:24,minZoom:2,zoomSnap:0}).setView([20,0],3);
const google=L.tileLayer("https://{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}",{subdomains:["mt0","mt1","mt2","mt3"],maxZoom:24,maxNativeZoom:21,attribution:"Imagery &copy; Google"}).addTo(map);
const esri=L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxZoom:24,maxNativeZoom:19,attribution:"Imagery &copy; Esri, Maxar, Earthstar Geographics"});
const none=L.layerGroup();
L.control.layers({ "Google":google, "Esri":esri, "None":none },null,{position:"topright",collapsed:false}).addTo(map);
L.control.scale({position:"bottomright",imperial:false,metric:true,maxWidth:170}).addTo(map);
const markerLayer=L.layerGroup().addTo(map);
const highlightLayer=L.layerGroup().addTo(map);
map.keyboard.disable();
let hlMarker=null;
function highlightDot(p){ clearHighlight(); if(!p||p.lat==null)return; hlMarker=L.circleMarker([p.lat,p.lng],{radius:13,color:"#ffffff",weight:3,fillColor:"#5865F2",fillOpacity:.45,interactive:false,className:"hl-dot"}).addTo(highlightLayer); }
function clearHighlight(){ if(hlMarker){ highlightLayer.removeLayer(hlMarker); hlMarker=null; } }
function highlightCurrent(){ if(lb.classList.contains("open")&&lightboxList[lightboxIndex]) highlightDot(lightboxList[lightboxIndex]); else clearHighlight(); }
map.on("moveend zoomend",()=>{ renderClusters(); updateGallery(); persistState(); });

/* proximity clustering */
function buildCluster(){
  const feats=photos.filter(p=>p.lat!=null && passDate(p) && (!boxBounds||boxBounds.contains([p.lat,p.lng]))).map(p=>({type:"Feature",properties:{pid:p.id},geometry:{type:"Point",coordinates:[p.lng,p.lat]}}));
  cluster=new Supercluster({radius:64,maxZoom:21,minPoints:2});
  cluster.load(feats);
}
function renderClusters(){
  markerLayer.clearLayers();
  if(!cluster) return;
  const b=map.getBounds();
  let w=Math.max(-180,b.getWest()),e=Math.min(180,b.getEast()),s=Math.max(-85,b.getSouth()),n=Math.min(85,b.getNorth());
  const z=Math.round(map.getZoom());
  let cl; try{ cl=cluster.getClusters([w,s,e,n],z); }catch(err){ return; }
  for(const c of cl){
    const [lng,lat]=c.geometry.coordinates;
    if(c.properties.cluster){
      const cnt=c.properties.point_count, size=cnt<10?34:cnt<100?42:cnt<1000?52:62, fs=cnt<100?13:cnt<1000?12:11;
      const icon=L.divIcon({className:"",html:'<div class="cl-bubble" style="width:'+size+'px;height:'+size+'px;font-size:'+fs+'px">'+c.properties.point_count_abbreviated+'</div>',iconSize:[size,size],iconAnchor:[size/2,size/2]});
      const m=L.marker([lat,lng],{icon}); const cid=c.properties.cluster_id;
      m.on("click",()=>{ let ez=Math.min(cluster.getClusterExpansionZoom(cid),map.getMaxZoom()); map.flyTo([lat,lng],ez,{duration:.45}); });
      markerLayer.addLayer(m);
    } else {
      const p=photoById(c.properties.pid); if(!p) continue;
      const hit=L.circleMarker([lat,lng],{radius:15,stroke:false,fill:true,fillOpacity:0});
      hit.on("mouseover",e=>showHover(p,e.originalEvent)); hit.on("mousemove",e=>positionHover(e.originalEvent)); hit.on("mouseout",hideHover); hit.on("click",()=>openViewer(p));
      const dot=L.circleMarker([lat,lng],{radius:6,color:"#3A41B0",weight:2,fillColor:"#5865F2",fillOpacity:.95,interactive:false,className:"photo-dot"});
      markerLayer.addLayer(hit); markerLayer.addLayer(dot);
    }
  }
}

/* file loading */
const IMG_RE=/\.(jpe?g|png|tiff?|heic|heif|webp|gif|bmp)$/i;
const hasFSA="showDirectoryPicker" in window;
document.getElementById("btnFolder").addEventListener("click",openFolder);
document.getElementById("folderInput").addEventListener("change",e=>{
  const fl=Array.from(e.target.files||[]);
  const items=fl.filter(f=>IMG_RE.test(f.name)).map(f=>({name:f.name,path:f.webkitRelativePath||f.name,getFile:async()=>f}));
  folderName=(fl[0]&&(fl[0].webkitRelativePath||"").split("/")[0])||"folder";
  ingest(items);
});
async function openFolder(){
  if(hasFSA){
    try{ dirHandle=await window.showDirectoryPicker(); await idbSet("dirHandle",dirHandle); folderName=dirHandle.name; await loadFromHandle(dirHandle); }
    catch(err){ if(err&&err.name==="AbortError")return; console.warn("picker fallback",err); document.getElementById("folderInput").click(); }
  } else { document.getElementById("folderInput").click(); }
}
async function* walkDir(handle,prefix){
  for await (const [name,h] of handle.entries()){
    const path=prefix?prefix+"/"+name:name;
    if(h.kind==="file") yield {handle:h,name,path};
    else if(h.kind==="directory") yield* walkDir(h,path);
  }
}
async function loadFromHandle(handle, append){
  const items=[];
  for await (const f of walkDir(handle,"")) if(IMG_RE.test(f.name)) items.push({name:f.name,path:f.path,getFile:()=>f.handle.getFile()});
  await ingest(items, append);
}
const progress=document.getElementById("progress");
function rebuildSizeIndex(){ sizeIndex=new Map(); for(const p of photos){ if(p.size!=null && !sizeIndex.has(p.size)) sizeIndex.set(p.size,p); } }
function addPath(p,path){ if(!path) return; if(!Array.isArray(p.paths)) p.paths=p.path?[p.path]:[]; if(!p.paths.includes(path)) p.paths.push(path); }
async function ingest(items, append){
  if(!items.length){ alert("No image files found in that drop."); return; }
  const wasEmpty=photos.length===0;
  if(!append) clearAll(false);
  rebuildSizeIndex();   // de-dupe new files against everything already loaded (appends, JSON sessions)
  let done=0; const total=items.length; progress.style.width="0%";
  let idx=0; const POOL=6;
  async function worker(){ while(idx<items.length){ const it=items[idx++]; try{ await processOne(it); }catch(e){} done++; progress.style.width=(done/total*100).toFixed(1)+"%"; } }
  await Promise.all(Array.from({length:POOL},worker));
  finishLoad(!append || wasEmpty); setTimeout(()=>progress.style.width="0%",600);
}
async function processOne(it){
  const file=await it.getFile();
  const sz=file.size;
  // De-dupe by exact byte size: identical file from an overlapping folder -> keep one pin,
  // just record the extra folder path so it stays searchable under either folder name.
  // The check-and-reserve below runs synchronously (no await between), so it is race-safe
  // across the concurrent worker pool.
  if(sz!=null && sizeIndex.has(sz)){ addPath(sizeIndex.get(sz),it.path); return; }
  const p={id:nextId++,path:it.path,name:it.name,file,size:sz,isHeic:false,thumb:null,preview:null,full:null,lat:null,lng:null,time:null,dir:null,marks:[],paths:[it.path]};
  if(sz!=null) sizeIndex.set(sz,p);
  photos.push(p);
  try{
    const ex=await exifr.parse(file,{tiff:true,ifd0:true,exif:true,gps:true});
    if(ex){
      if(typeof ex.latitude==="number"&&typeof ex.longitude==="number"){ p.lat=ex.latitude; p.lng=ex.longitude; }
      const d=ex.DateTimeOriginal||ex.CreateDate||ex.ModifyDate; if(d instanceof Date&&!isNaN(d)) p.time=d.getTime();
      if(typeof ex.GPSImgDirection==="number") p.dir=ex.GPSImgDirection;
    }
  }catch(e){}
  p.isHeic=isHeic(file);
  let disp=file;
  if(p.isHeic){ try{ disp=await heicToJpegBlob(file,0.82); }catch(e){} }
  const imgs=await makePreviews(disp).catch(()=>({thumb:null,preview:null}));
  p.thumb=imgs.thumb; p.preview=imgs.preview;
}
function isHeic(file){ return /\.(heic|heif)$/i.test(file.name||"") || /heic|heif/i.test(file.type||""); }
async function heicToJpegBlob(file,quality){
  if(typeof heic2any==="undefined") throw new Error("heic2any not loaded");
  const out=await heic2any({blob:file,toType:"image/jpeg",quality:quality});
  return Array.isArray(out)?out[0]:out;
}
function makePreviews(file){
  return new Promise(res=>{
    const url=URL.createObjectURL(file); const img=new Image();

function fitToPhotos(){

  if(!geo.length) geo=photos.filter(p=>p.lat!=null);

/* drag and drop */
const dz=document.getElementById("dropzone"); let dragDepth=0;
window.addEventListener("dragenter",e=>{e.preventDefault();dragDepth++;dz.classList.add("show");});
window.addEventListener("dragover",e=>e.preventDefault());
window.addEventListener("dragleave",e=>{e.preventDefault();if(--dragDepth<=0)dz.classList.remove("show");});
window.addEventListener("drop",async e=>{
  e.preventDefault();dragDepth=0;dz.classList.remove("show");
  const dt=e.dataTransfer;
  const items=dt.items?Array.from(dt.items):[];
  const useFSA=hasFSA&&items[0]&&items[0].getAsFileSystemHandle;
  const handlePs=useFSA?items.map(it=>it.getAsFileSystemHandle?it.getAsFileSystemHandle():Promise.resolve(null)):null;
  const entries=(!useFSA&&items[0]&&items[0].webkitGetAsEntry)?items.map(it=>it.webkitGetAsEntry()):null;
  const files=Array.from(dt.files||[]);
  if(handlePs){
    const handles=(await Promise.all(handlePs.map(p=>p.catch(()=>null)))).filter(Boolean);
    const dirs=handles.filter(h=>h.kind==="directory"), fileHandles=handles.filter(h=>h.kind==="file");
    if(dirs.length===1&&fileHandles.length===0){ const h=dirs[0]; if(!dirHandle){ dirHandle=h; try{await idbSet("dirHandle",h);}catch(er){} folderName=folderName||h.name; } await loadFromHandle(h,true); return; }
    const out=[];
    for(const h of fileHandles) out.push({name:h.name,path:h.name,getFile:()=>h.getFile()});
    for(const d of dirs){ for await (const f of walkDir(d,d.name)) if(IMG_RE.test(f.name)) out.push({name:f.name,path:f.path,getFile:()=>f.handle.getFile()}); }
    ingest(out.filter(o=>IMG_RE.test(o.name)),true); return;
  }
  if(entries&&entries.some(Boolean)){ ingest(await entriesToItems(entries),true); return; }
  const fl=files.filter(f=>IMG_RE.test(f.name)).map(f=>({name:f.name,path:f.name,getFile:async()=>f})); ingest(fl,true);
});
function entriesToItems(roots){
  roots=(roots||[]).filter(Boolean);
  const out=[];
  const walk=(entry,prefix)=>new Promise(res=>{
    const path=prefix?prefix+"/"+entry.name:entry.name;
    if(entry.isFile){ entry.file(f=>{out.push({name:f.name,path,getFile:async()=>f});res();},()=>res()); }
    else if(entry.isDirectory){ const rd=entry.createReader(); const step=()=>rd.readEntries(async b=>{ if(!b.length){res();return;} await Promise.all(b.map(c=>walk(c,path))); step(); },()=>res()); step(); }
    else res();
  });
  return Promise.all(roots.map(r=>walk(r,""))).then(()=>out.filter(o=>IMG_RE.test(o.name)));
}

function buildDateFilter(){

  dateMin=times[0]; dateMax=times[0]; for(const t of times){ if(t<dateMin)dateMin=t; if(t>dateMax)dateMax=t; }
  dateLo=dateMin; dateHi=dateMax; bar.classList.remove("hidden"); syncSliderUI();
}

document.getElementById("dateReset").addEventListener("click",()=>{ dateLo=dateMin; dateHi=dateMax; syncSliderUI(); buildCluster(); renderClusters(); updateStats(); updateGallery(); persistState(); });

function stopDraw(){ map.off("mousedown",dDown); map.off("mousemove",dMove); map.off("mouseup",dUp); if(tempRect){map.removeLayer(tempRect);tempRect=null;} drawing=false; drawMode=null; map.dragging.enable(); map.getContainer().style.cursor=""; setAreaBtn(); }

function updateGallery(){

function closeViewer(){ if(!lb.classList.contains("open")) return; if(selMark) deselectText(); closeFileInfo(); setMarkTool("none"); draft=null; polyPrev=null; clearHighlight(); lb.classList.remove("open"); if(curUrl){URL.revokeObjectURL(curUrl);curUrl=null;} lbImg.src=""; setTimeout(()=>{ map.invalidateSize(); renderClusters(); positionTools(); },30); }
document.getElementById("lbClose").addEventListener("click",closeViewer);
document.getElementById("lbPrev").addEventListener("click",e=>{e.stopPropagation();vStep(-1);});
document.getElementById("lbNext").addEventListener("click",e=>{e.stopPropagation();vStep(1);});
document.addEventListener("keydown",e=>{
  if(!lb.classList.contains("open"))return;
  if(document.activeElement===tbText){ if(e.key==="Escape"){ e.preventDefault(); deselectText(); } else if(e.key==="Enter"){ e.preventDefault(); document.execCommand("insertText",false,"\n"); } return; }
  if(e.key==="Escape"){
    if(selMark){ deselectText(); return; }
    if(draft&&draft.t==="poly"){ endPoly(false); return; }
    if(draft){ draft=null; polyPrev=null; redrawMarks(); return; }
    if(markTool!=="none"){ setMarkTool("none"); return; }
    if(fileInfoShown){ closeFileInfo(); return; }
    return;
  }
  if(e.key==="Enter"){ if(markTool==="poly"&&draft&&draft.t==="poly"&&draft.p.length>=2){ curMarks().push({t:"poly",p:draft.p,c:draft.c,k:draft.k}); draft=null; polyPrev=null; afterMarkChange(); } return; }
  const tag=((e.target&&e.target.tagName)||"").toLowerCase(); if(tag==="input") return;
  if(e.key==="ArrowLeft"){ e.preventDefault(); vStep(-1); return; }
  if(e.key==="ArrowRight"){ e.preventDefault(); vStep(1); return; }
  if(!e.ctrlKey&&!e.metaKey){ const map={p:"pen",l:"poly",a:"arrow",r:"rect",o:"oval",t:"text",e:"erase"}; const k=e.key.toLowerCase(); if(map[k]){ e.preventDefault(); setMarkTool(map[k]===markTool?"none":map[k]); } }
});

  window.addEventListener("mouseup",()=>{ if(!drag)return; drag=false; document.body.style.cursor=""; document.body.style.userSelect=""; map.invalidateSize(); renderClusters(); });

const tbEditor=document.getElementById("tbEditor"), tbText=document.getElementById("tbText");
let markColor="#ff3b30", markThick=5, selMark=null, selPhoto=null;
function curPhoto(){ return lightboxList[lightboxIndex]; }
function curMarks(){ const p=curPhoto(); if(!p)return []; if(!p.marks)p.marks=[]; return p.marks; }
function afterMarkChange(){ redoMarks=[]; redrawMarks(); persistState(); }
function setColor(c){ markColor=c; document.querySelectorAll("#markPalette .sw").forEach(b=>b.classList.toggle("on",b.dataset.c===c)); if(selMark){ selMark.c=c; tbText.style.color=c; tbText.style.borderColor=c; } }
document.querySelectorAll("#markPalette .sw").forEach(b=>b.addEventListener("click",e=>{ e.stopPropagation(); setColor(b.dataset.c); }));
const thickSlider=document.getElementById("thickSlider");
thickSlider.addEventListener("input",()=>{ markThick=parseInt(thickSlider.value)||5; });

function setMarkTool(t){ if(selMark) deselectText(); markTool=t; draft=null; polyPrev=null; lbStage.classList.toggle("drawing",t!=="none"); document.getElementById("markPalette").classList.toggle("show",t!=="none"); document.querySelectorAll(".ip-marktools .mk[data-tool]").forEach(b=>b.classList.toggle("on",b.dataset.tool===t)); redrawMarks(); }
document.querySelectorAll(".ip-marktools .mk[data-tool]").forEach(b=>{ b.addEventListener("click",e=>{ e.stopPropagation(); setMarkTool(b.dataset.tool===markTool?"none":b.dataset.tool); }); });
document.getElementById("mkClear").addEventListener("click",e=>{ e.stopPropagation(); if(selMark) deselectText(); const p=curPhoto(); if(p){ p.marks=[]; draft=null; polyPrev=null; afterMarkChange(); } });

function evToNorm(e){ const r=lbStage.getBoundingClientRect(); return { x:((e.clientX-r.left-vTx)/vScale)/fitW, y:((e.clientY-r.top-vTy)/vScale)/fitH }; }
function orthoNorm(last,pt){ const dxp=(pt[0]-last[0])*fitW, dyp=(pt[1]-last[1])*fitH; return (Math.abs(dxp)>=Math.abs(dyp))?[pt[0],last[1]]:[last[0],pt[1]]; }
function distPx(a,b){ return Math.hypot((a[0]-b[0])*fitW,(a[1]-b[1])*fitH); }

function paintMarks(ctx,ox,oy,sx,sy,lwBase,list){
  ctx.save(); ctx.lineJoin="round"; ctx.lineCap="round"; ctx.shadowColor="rgba(0,0,0,.4)";
  const PX=n=>ox+n*sx, PY=n=>oy+n*sy;
  for(const m of list){
    const col=m.c||"#ff3b30", lw=Math.max(1,lwBase*(m.k||5));
    ctx.strokeStyle=col; ctx.fillStyle=col; ctx.lineWidth=lw; ctx.shadowBlur=lw*0.5;
    if(m.t==="pen"||m.t==="poly"){ const pts=m.p; if(!pts||!pts.length)continue; ctx.beginPath(); ctx.moveTo(PX(pts[0][0]),PY(pts[0][1])); for(let i=1;i<pts.length;i++) ctx.lineTo(PX(pts[i][0]),PY(pts[i][1])); if(pts.length===1) ctx.lineTo(PX(pts[0][0])+0.01,PY(pts[0][1])+0.01); ctx.stroke(); }
    else if(m.t==="rect"){ ctx.strokeRect(PX(m.x),PY(m.y),m.w*sx,m.h*sy); }
    else if(m.t==="oval"){ ctx.beginPath(); ctx.ellipse(PX(m.x+m.w/2),PY(m.y+m.h/2),Math.abs(m.w/2*sx),Math.abs(m.h/2*sy),0,0,Math.PI*2); ctx.stroke(); }
    else if(m.t==="arrow"){ const x1=PX(m.x),y1=PY(m.y),x2=PX(m.x2),y2=PY(m.y2); ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); const ang=Math.atan2(y2-y1,x2-x1), hl=Math.max(8,lw*4.5); ctx.beginPath(); ctx.moveTo(x2,y2); ctx.lineTo(x2-hl*Math.cos(ang-0.45),y2-hl*Math.sin(ang-0.45)); ctx.moveTo(x2,y2); ctx.lineTo(x2-hl*Math.cos(ang+0.45),y2-hl*Math.sin(ang+0.45)); ctx.stroke(); }
    else if(m.t==="text"||m.t==="call"){ paintLabel(ctx,m,PX,PY,sy,col); }
  }
  ctx.restore();
}
function paintLabel(ctx,m,PX,PY,sy,col){
  const fpx=Math.max(9,(m.th||0.03)*sy);
  ctx.save(); ctx.shadowBlur=0; ctx.font="600 "+fpx+"px 'Aptos',sans-serif"; ctx.textBaseline="top";
  const lines=String(m.s||"").split("\n"), lh=fpx*1.2, padx=fpx*0.42, pady=fpx*0.3;
  let maxw=0; for(const ln of lines){ const w=ctx.measureText(ln).width; if(w>maxw)maxw=w; }
  const bw=maxw+padx*2, bh=lines.length*lh+pady*2;
  const bx=PX(m.x), by=PY(m.y);
  if(m.t==="call"){ ctx.strokeStyle=col; ctx.lineWidth=Math.max(1.5,fpx*0.08); ctx.beginPath(); ctx.moveTo(bx+bw/2,by+bh/2); ctx.lineTo(PX(m.tx),PY(m.ty)); ctx.stroke(); }
  ctx.fillStyle="#ffffff"; ctx.fillRect(bx,by,bw,bh);
  ctx.strokeStyle=col; ctx.lineWidth=Math.max(1.5,fpx*0.09); ctx.strokeRect(bx,by,bw,bh);
  ctx.fillStyle=col; for(let i=0;i<lines.length;i++) ctx.fillText(lines[i],bx+padx,by+pady+i*lh);
  ctx.restore();
}
function redrawMarks(){
  if(!lbMark.width) return; markCtx.clearRect(0,0,lbMark.width,lbMark.height);
  const p=curPhoto(); if(!p) return;
  const lwBase=Math.min(fitW,fitH)*0.0012;
  const list=(p.marks||[]).filter(m=>m!==selMark).concat(draft?[draft]:[]);
  paintMarks(markCtx,vTx,vTy,fitW*vScale,fitH*vScale,lwBase,list);
  if(draft&&draft.t==="poly"&&polyPrev&&draft.p.length){ const a=draft.p[draft.p.length-1]; markCtx.save(); markCtx.strokeStyle=draft.c||"#ff3b30"; markCtx.lineWidth=Math.max(1,lwBase*(draft.k||5)); markCtx.setLineDash([6,6]); markCtx.beginPath(); markCtx.moveTo(vTx+a[0]*fitW*vScale,vTy+a[1]*fitH*vScale); markCtx.lineTo(vTx+polyPrev.x*fitW*vScale,vTy+polyPrev.y*fitH*vScale); markCtx.stroke(); markCtx.restore(); }
}
function segDistPx(p,a,b){ const dx=b[0]-a[0],dy=b[1]-a[1],L2=dx*dx+dy*dy; let t=L2?((p[0]-a[0])*dx+(p[1]-a[1])*dy)/L2:0; t=Math.max(0,Math.min(1,t)); return Math.hypot(p[0]-(a[0]+t*dx),p[1]-(a[1]+t*dy)); }
function textBox(m){ const fpx=(m.th||0.03)*fitH; const lines=String(m.s||"").split("\n"); let maxlen=0; for(const ln of lines) maxlen=Math.max(maxlen,ln.length); const w=Math.max(8,maxlen*fpx*0.6)+fpx*0.84, h=lines.length*fpx*1.2+fpx*0.6; return {x:m.x*fitW,y:m.y*fitH,w,h}; }
function hitMark(m,n){ const np=[n.x*fitW,n.y*fitH], thr=11;
  if(m.t==="pen"||m.t==="poly"){ const pts=m.p; if(pts.length===1) return Math.hypot(np[0]-pts[0][0]*fitW,np[1]-pts[0][1]*fitH)<thr; for(let i=1;i<pts.length;i++){ if(segDistPx(np,[pts[i-1][0]*fitW,pts[i-1][1]*fitH],[pts[i][0]*fitW,pts[i][1]*fitH])<thr) return true; } return false; }
  if(m.t==="arrow"){ return segDistPx(np,[m.x*fitW,m.y*fitH],[m.x2*fitW,m.y2*fitH])<thr; }
  if(m.t==="text"||m.t==="call"){ const b=textBox(m); return np[0]>=b.x-thr&&np[0]<=b.x+b.w+thr&&np[1]>=b.y-thr&&np[1]<=b.y+b.h+thr; }
  const x0=Math.min(m.x,m.x+m.w)*fitW, x1=Math.max(m.x,m.x+m.w)*fitW, y0=Math.min(m.y,m.y+m.h)*fitH, y1=Math.max(m.y,m.y+m.h)*fitH;
  return np[0]>=x0-thr&&np[0]<=x1+thr&&np[1]>=y0-thr&&np[1]<=y1+thr;
}
function hitText(n){ const ms=curMarks(); for(let i=ms.length-1;i>=0;i--){ if(ms[i].t==="text"&&hitMark(ms[i],n)) return ms[i]; } return null; }
function eraseAt(n){ const ms=curMarks(); for(let i=ms.length-1;i>=0;i--){ if(hitMark(ms[i],n)){ if(ms[i]===selMark){ selMark=null; selPhoto=null; tbEditor.style.display="none"; } ms.splice(i,1); afterMarkChange(); return; } } }

/* ---- inline text editor (one box at a time) ---- */
function positionEditor(){ if(!selMark)return; const sx=fitW*vScale, sy=fitH*vScale; tbEditor.style.left=(lbStage.offsetLeft+vTx+selMark.x*sx)+"px"; tbEditor.style.top=(lbStage.offsetTop+vTy+selMark.y*sy)+"px"; tbText.style.fontSize=Math.max(8,(selMark.th||0.03)*sy)+"px"; }
function selectText(m){ if(selMark&&selMark!==m) deselectText(); selMark=m; selPhoto=curPhoto(); tbText.textContent=m.s||""; tbText.style.color=m.c||markColor; tbText.style.borderColor=m.c||markColor; tbEditor.style.display="block"; positionEditor(); redrawMarks(); setTimeout(()=>{ tbText.focus(); const r=document.createRange(); r.selectNodeContents(tbText); r.collapse(false); const s=getSelection(); s.removeAllRanges(); s.addRange(r); },0); }
function deselectText(){ if(!selMark)return; const m=selMark, ph=selPhoto; const txt=tbText.innerText.replace(/\u00a0/g," ").replace(/\s+$/,"").replace(/^\s+/,""); m.s=txt; selMark=null; selPhoto=null; tbEditor.style.display="none"; if(!txt&&ph&&ph.marks){ const i=ph.marks.indexOf(m); if(i>=0) ph.marks.splice(i,1); } redrawMarks(); persistState(); }
function newText(n){ const m={t:"text",x:Math.min(0.96,Math.max(0,n.x)),y:Math.min(0.96,Math.max(0,n.y)),s:"",th:Math.max(0.012,Math.min(0.06,13/fitH)),c:markColor}; curMarks().push(m); selectText(m); }
document.getElementById("tbMinus").addEventListener("mousedown",e=>e.preventDefault());
document.getElementById("tbPlus").addEventListener("mousedown",e=>e.preventDefault());
document.getElementById("tbMinus").addEventListener("click",e=>{ e.stopPropagation(); if(selMark){ selMark.th=Math.max(0.012,(selMark.th||0.03)*0.85); positionEditor(); } });
document.getElementById("tbPlus").addEventListener("click",e=>{ e.stopPropagation(); if(selMark){ selMark.th=Math.min(0.3,(selMark.th||0.03)*1.18); positionEditor(); } });
document.getElementById("tbDel").addEventListener("mousedown",e=>e.preventDefault());
document.getElementById("tbDel").addEventListener("click",e=>{ e.stopPropagation(); const m=selMark, ph=selPhoto; selMark=null; selPhoto=null; tbEditor.style.display="none"; if(m&&ph&&ph.marks){ const i=ph.marks.indexOf(m); if(i>=0) ph.marks.splice(i,1); } afterMarkChange(); });
(function(){ const mv=document.getElementById("tbMove"); let on=false,sx0,sy0,ox0,oy0; mv.addEventListener("mousedown",e=>{ if(!selMark)return; e.preventDefault(); e.stopPropagation(); on=true; sx0=e.clientX; sy0=e.clientY; ox0=selMark.x; oy0=selMark.y; }); window.addEventListener("mousemove",e=>{ if(!on||!selMark)return; selMark.x=Math.max(0,Math.min(0.99,ox0+(e.clientX-sx0)/(fitW*vScale))); selMark.y=Math.max(0,Math.min(0.99,oy0+(e.clientY-sy0)/(fitH*vScale))); positionEditor(); }); window.addEventListener("mouseup",()=>{ if(on){ on=false; persistState(); } }); })();

function onDown(e){
  if(!lb.classList.contains("open")||e.button!==0) return;
  if(e.target.closest&&(e.target.closest(".lb-ref")||e.target.closest("#tbEditor"))) return;
  if(selMark) deselectText();
  const n=evToNorm(e);
  if(markTool==="none"){ const h=hitText(n); if(h){ selectText(h); return; } if(vScale<=1)return; panning=true; panX=e.clientX; panY=e.clientY; lbStage.classList.add("panning"); return; }
  if(markTool==="text"){ const h=hitText(n); if(h){ selectText(h); } else { newText(n); } return; }
  if(markTool==="pen"){ draft={t:"pen",p:[[n.x,n.y]],c:markColor,k:markThick,_sx:n.x,_sy:n.y}; dragging=true; redoMarks=[]; redrawMarks(); return; }
  if(markTool==="arrow"){ draft={t:"arrow",x:n.x,y:n.y,x2:n.x,y2:n.y,c:markColor,k:markThick}; dragging=true; redoMarks=[]; return; }
  if(markTool==="rect"||markTool==="oval"){ draft={t:markTool,x:n.x,y:n.y,w:0,h:0,_sx:n.x,_sy:n.y,c:markColor,k:markThick}; dragging=true; redoMarks=[]; return; }
  if(markTool==="erase"){ erasing=true; eraseAt(n); return; }
  if(markTool==="poly"){ if(!draft||draft.t!=="poly"){ draft={t:"poly",p:[[n.x,n.y]],c:markColor,k:markThick}; } else { const last=draft.p[draft.p.length-1]; let pt=[n.x,n.y]; if(e.shiftKey) pt=orthoNorm(last,pt); if(distPx(last,pt)>=6) draft.p.push(pt); } redoMarks=[]; redrawMarks(); return; }
}
function onMove(e){
  if(panning){ vTx+=e.clientX-panX; vTy+=e.clientY-panY; panX=e.clientX; panY=e.clientY; applyView(); return; }
  if(erasing){ eraseAt(evToNorm(e)); return; }
  if(dragging&&draft){ const n=evToNorm(e);
    if(draft.t==="pen"){ if(e.shiftKey){ draft.p=[[draft._sx,draft._sy],[n.x,n.y]]; draft._straight=true; } else { draft.p.push([n.x,n.y]); draft._straight=false; } }
    else if(draft.t==="arrow"){ let p=[n.x,n.y]; if(e.shiftKey) p=orthoNorm([draft.x,draft.y],p); draft.x2=p[0]; draft.y2=p[1]; }
    else { let dxp=(n.x-draft._sx)*fitW, dyp=(n.y-draft._sy)*fitH; if(e.shiftKey){ const mm=Math.max(Math.abs(dxp),Math.abs(dyp)); dxp=(dxp<0?-1:1)*mm; dyp=(dyp<0?-1:1)*mm; } draft.x=draft._sx; draft.y=draft._sy; draft.w=dxp/fitW; draft.h=dyp/fitH; }
    redrawMarks(); return; }
  if(markTool==="poly"&&draft&&draft.t==="poly"&&draft.p.length){ const r=lbStage.getBoundingClientRect(); let pt=[(e.clientX-r.left-vTx)/vScale/fitW,(e.clientY-r.top-vTy)/vScale/fitH]; if(e.shiftKey) pt=orthoNorm(draft.p[draft.p.length-1],pt); polyPrev={x:pt[0],y:pt[1]}; redrawMarks(); }
}
function finishPen(){ if(draft&&draft.t==="pen"){ if(draft.p.length){ curMarks().push({t:"pen",p:draft.p,c:draft.c,k:draft.k}); afterMarkChange(); } draft=null; dragging=false; redrawMarks(); } }
function onUp(){
  panning=false; lbStage.classList.remove("panning"); erasing=false;
  if(dragging&&draft){
    if(draft.t==="pen"){ finishPen(); return; }
    if(draft.t==="arrow"){ if(distPx([draft.x,draft.y],[draft.x2,draft.y2])>4){ curMarks().push({t:"arrow",x:draft.x,y:draft.y,x2:draft.x2,y2:draft.y2,c:draft.c,k:draft.k}); afterMarkChange(); } }
    else { let x=draft.x,y=draft.y,w=draft.w,h=draft.h; if(w<0){x+=w;w=-w;} if(h<0){y+=h;h=-h;} if(w*fitW>4&&h*fitH>4){ curMarks().push({t:draft.t,x,y,w,h,c:draft.c,k:draft.k}); afterMarkChange(); } }
    draft=null; dragging=false; redrawMarks();
  }
}
window.addEventListener("keyup",e=>{ if(e.key==="Shift"&&dragging&&draft&&draft.t==="pen"&&draft._straight){ finishPen(); } });
lbStage.addEventListener("mousedown",onDown);
window.addEventListener("mousemove",onMove);
window.addEventListener("mouseup",onUp);
function endPoly(addCursor){ if(!draft||draft.t!=="poly")return; if(addCursor&&polyPrev){ const last=draft.p[draft.p.length-1]; if(!last||distPx(last,[polyPrev.x,polyPrev.y])>=4) draft.p.push([polyPrev.x,polyPrev.y]); } if(draft.p.length>=2){ curMarks().push({t:"poly",p:draft.p,c:draft.c,k:draft.k}); afterMarkChange(); } draft=null; polyPrev=null; redrawMarks(); }
lbStage.addEventListener("dblclick",e=>{ if(markTool==="poly"&&draft&&draft.t==="poly") endPoly(false); });
lbStage.addEventListener("contextmenu",e=>{ if(markTool==="poly"&&draft&&draft.t==="poly"){ e.preventDefault(); endPoly(true); } });

/* ---- file info popover ---- */
let fileInfoShown=false;
function closeFileInfo(){ fileInfoShown=false; document.getElementById("fileInfo").style.display="none"; }
function buildInfoHTML(p){ const rows=[["Name",p.name||""]]; if(p.time)rows.push(["Taken",fmtDate(p.time)]); if(p.size!=null)rows.push(["Size",fmtSize(p.size)]); if(p.lat!=null){ rows.push(["Latitude",(+p.lat).toFixed(6)]); rows.push(["Longitude",(+p.lng).toFixed(6)]); } if(p.dir!=null)rows.push(["Heading",Math.round(p.dir)+"\u00B0"]); if(p.isHeic)rows.push(["Format","HEIC"]); if(p.path&&p.path!==p.name)rows.push(["Path",p.path]); return rows.map(r=>'<div class="firow"><span class="fik">'+esc(r[0])+'</span><span class="fiv">'+esc(String(r[1]))+'</span></div>').join(""); }
document.getElementById("fileInfoBtn").addEventListener("click",e=>{ e.stopPropagation(); const fi=document.getElementById("fileInfo"); if(fileInfoShown){ closeFileInfo(); return; } const p=curPhoto(); if(!p)return; fi.innerHTML=buildInfoHTML(p); fi.style.display="block"; fileInfoShown=true; });
document.addEventListener("mousedown",e=>{ if(fileInfoShown && !e.target.closest("#fileInfo") && e.target.id!=="fileInfoBtn"){ closeFileInfo(); } },true);

function btnFlash(btn,txt){ const o=btn.textContent; btn.textContent=txt; setTimeout(()=>{btn.textContent=o;},1300); }
function copyImage(btn){
  if(selMark) deselectText();
  const p=curPhoto(); if(!p)return; const src=p.full||p.preview||p.thumb; if(!src){ alert("No image to copy yet."); return; }
  const img=new Image();
  img.onload=()=>{ const W=img.naturalWidth||img.width, H=img.naturalHeight||img.height; const c=document.createElement("canvas"); c.width=W; c.height=H; const cx=c.getContext("2d"); cx.drawImage(img,0,0,W,H); paintMarks(cx,0,0,W,H,Math.min(W,H)*0.0012,(p.marks||[])); c.toBlob(async(blob)=>{ if(!blob){ alert("Could not render the image."); return; } try{ await navigator.clipboard.write([new ClipboardItem({"image/png":blob})]); btnFlash(btn,"Copied"); }catch(err){ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=(p.name||"image").replace(/\.[^.]+$/,"")+"-markup.png"; document.body.appendChild(a); a.click(); a.remove(); btnFlash(btn,"Downloaded"); } },"image/png"); };
  img.onerror=()=>alert("Could not load the image for copying.");
  img.src=src;
}
document.addEventListener("keydown",e=>{
  if(document.activeElement===tbText) return;
  if((e.ctrlKey||e.metaKey)&&(e.key==="z"||e.key==="Z")){ e.preventDefault();
    if(measuring&&measurePts.length){ measurePts.pop(); drawMeasure(); return; }
    const open=lb.classList.contains("open");
    if(open&&draft&&draft.t==="poly"&&draft.p.length){ draft.p.pop(); if(!draft.p.length){ draft=null; polyPrev=null; } redrawMarks(); return; }
    if(open&&e.shiftKey){ if(redoMarks.length){ curMarks().push(redoMarks.pop()); redrawMarks(); persistState(); } return; }
    if(open){ const ms=curMarks(); if(ms.length){ redoMarks.push(ms.pop()); redrawMarks(); persistState(); } else undoDelete(); } else undoDelete(); return; }
  if((e.ctrlKey||e.metaKey)&&(e.key==="y"||e.key==="Y")){ e.preventDefault(); if(lb.classList.contains("open")&&redoMarks.length){ curMarks().push(redoMarks.pop()); redrawMarks(); persistState(); } return; }
  const tag=((e.target&&e.target.tagName)||"").toLowerCase();
  if(tag==="input"||tag==="select"||tag==="textarea") return;
  if(document.activeElement===tbText) return;
  if(e.key==="Escape"){ if(drawing) stopDraw(); if(measuring) stopMeasure(); return; }
  if(e.key==="z"||e.key==="Z"){ toggleZoom(); }
  else if(e.key==="f"||e.key==="F"){ toggleFilter(); }
  else if(e.key==="m"||e.key==="M"){ toggleMeasure(); }
});

/* ENHANCE: bake full quality original into this one photo */
lbFull.addEventListener("change",async ()=>{
  const p=lightboxList[lightboxIndex]; if(!p) return;
  if(lbFull.checked){
    lbFullWrap.classList.add("busy");
    let ok=false; try{ ok=await showFull(p); }catch(e){}
    lbFullWrap.classList.remove("busy");
    if(lightboxList[lightboxIndex]!==p) return;
    if(!ok){ lbFull.checked=false; alert("Could not load the full quality original for "+p.name+".\n\nWhen prompted, select the folder that contains your photos (e.g. the \"Photos\" folder), then tick Full quality again."); }
  } else {
    showPreview(p,true);
  }
});
document.getElementById("lbDel").addEventListener("click",e=>{
  e.stopPropagation();
  const p=lightboxList[lightboxIndex]; if(!p) return;
  deletePhoto(p.id);
  if(lightboxList.length){ lightboxIndex=Math.min(lightboxIndex,lightboxList.length-1); loadViewer(); }
  else closeViewer();
});

/* In-memory index of originals (filename -> File) from a folder connected via the
   webkitdirectory input. This works even when the File System Access API is blocked
   (e.g. the app is embedded in an iframe) and does not disturb the loaded session. */
let originalIndex=null, origInputResolve=null;
const origInput=document.getElementById("origInput");
origInput.addEventListener("change",e=>{
  const fl=Array.from(e.target.files||[]);
  originalIndex=new Map();
  for(const f of fl){ if(IMG_RE.test(f.name)) originalIndex.set(f.name.toLowerCase(),f); }
  if(origInputResolve){ const r=origInputResolve; origInputResolve=null; r(originalIndex.size>0); }
});
origInput.addEventListener("cancel",()=>{ if(origInputResolve){ const r=origInputResolve; origInputResolve=null; r(false); } });
function connectViaInput(){ return new Promise(resolve=>{ origInputResolve=resolve; origInput.value=""; origInput.click(); }); }
async function connectSourceFolder(){
  if(hasFSA && window.showDirectoryPicker){
    try{ dirHandle=await window.showDirectoryPicker(); await idbSet("dirHandle",dirHandle); return true; }
    catch(err){ if(err&&err.name==="AbortError") return false; }   // blocked (iframe) or unsupported -> fall back to folder input
  }
  return await connectViaInput();
}
function fromIndex(p){ if(!originalIndex) return null; return originalIndex.get(String(p.name||"").toLowerCase())||null; }
async function fetchOriginal(p){
  // 1. Already-indexed original from a connected folder input.
  const cached=fromIndex(p); if(cached) return cached;
  // 2. File System Access handle (fast path-based resolution).
  if(!dirHandle){ try{ dirHandle=await idbGet("dirHandle"); }catch(e){} }
  if(dirHandle && await ensurePermission(dirHandle)){
    try{ return await resolveFileByPath(dirHandle,p.path); }catch(e){}
  }
  // 3. Ask the user to connect the source folder (picker, or folder input if blocked).
  const connected=await connectSourceFolder();
  if(!connected) return null;
  const idx=fromIndex(p); if(idx) return idx;
  if(dirHandle){ try{ return await resolveFileByPath(dirHandle,p.path); }catch(e){} }
  return null;
}
async function resolveFileByPath(dir,path){
  let segs=String(path).split("/").filter(Boolean);
  if(segs.length>1 && segs[0]===dir.name) segs=segs.slice(1);
  let h=dir; for(let i=0;i<segs.length-1;i++) h=await h.getDirectoryHandle(segs[i]);
  const fh=await h.getFileHandle(segs[segs.length-1]); return await fh.getFile();
}
function fileToDataURL(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(r.error); r.readAsDataURL(file); }); }

/* sidebar resize */
const splitter=document.getElementById("splitter"); let resizing=false;
splitter.addEventListener("mousedown",e=>{ resizing=true; e.preventDefault(); document.body.style.userSelect="none"; });
window.addEventListener("mousemove",e=>{ if(!resizing)return; let w=Math.max(220,Math.min(window.innerWidth*0.75,window.innerWidth-e.clientX-3)); document.documentElement.style.setProperty("--gallery-w",w+"px"); map.invalidateSize(); });
window.addEventListener("mouseup",()=>{ if(resizing){resizing=false;document.body.style.userSelect="";persistState();} });

/* file ops */
document.getElementById("btnClear").addEventListener("click",()=>clearAll(true));
document.getElementById("btnNew").addEventListener("click",async()=>{
  if(!confirm("Start a new map? This clears the current photos and the saved state."))return;
  clearAll(true); saveFileHandle=null; jsonHandle=null; dirHandle=null; folderName="";
  try{ await idbDel("lastState"); await idbDel("dirHandle"); await idbDel("jsonHandle"); await idbDel("lastFull"); }catch(e){}
  hideBanner();
});
function clearAll(redraw){
  if(boxRect){map.removeLayer(boxRect);boxRect=null;} boxBounds=null; setAreaBtn();
  photos=[]; nextId=1; cluster=null; markerLayer.clearLayers(); undoStack=[]; lightboxList=[]; lightboxIndex=0; sizeIndex=new Map();
  if(measuring) stopMeasure();
  dateMin=dateMax=dateLo=dateHi=null; document.getElementById("datebar").classList.add("hidden");
  if(redraw){ updateStats(); document.getElementById("galCount").textContent="0 shown"; document.getElementById("stView").textContent="0";
    document.getElementById("galleryBody").innerHTML='<div class="empty-msg"><b>Map cleared.</b><br/>Open a folder to load photos again.</div>'; persistState(); }
}
document.getElementById("btnSave").addEventListener("click",()=>saveState(false));
document.getElementById("btnSaveAs").addEventListener("click",()=>saveState(true));
async function saveState(asNew){
  if(!photos.length){ alert("Nothing to save yet."); return; }
  let stateObj,data;
  try{ stateObj=serializeState(true); data=JSON.stringify(stateObj); }
  catch(err){
    alert("This session is too large to write as one self contained file (the browser's text size limit). Narrow it with the date filter, enhance fewer images, or split the library into smaller session files.");
    return;
  }
  if(hasFSA&&window.showSaveFilePicker){
    try{
      if(asNew||!saveFileHandle){ saveFileHandle=await window.showSaveFilePicker({suggestedName:(folderName||"photomap")+".json",types:[{description:"PhotoMap state",accept:{"application/json":[".json"]}}]}); }
      const w=await saveFileHandle.createWritable();
      const CH=8*1024*1024;
      for(let i=0;i<data.length;i+=CH){ await w.write(data.slice(i,i+CH)); }
      await w.close();
      try{ const f2=await saveFileHandle.getFile(); if(f2.size < data.length*0.5){ alert("Warning: the file may not have written completely because it is very large. Narrow the session with the date filter, enhance fewer images, then save again."); } }catch(e){}
      jsonHandle=saveFileHandle; try{ await idbSet("jsonHandle",jsonHandle); }catch(e){}
    }catch(err){ if(err&&err.name!=="AbortError") downloadJson(data); }
  } else downloadJson(data);
  try{ await idbSet("lastFull",stateObj); }catch(e){}   // cache full session so it auto loads next launch
}
function downloadJson(data){ const blob=new Blob([data],{type:"application/json"}); const url=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=url; a.download=(folderName||"photomap")+".json"; a.click(); setTimeout(()=>URL.revokeObjectURL(url),500); }
document.getElementById("btnOpenJson").addEventListener("click",async()=>{
  if(hasFSA&&window.showOpenFilePicker){
    try{ const [h]=await window.showOpenFilePicker({types:[{description:"JSON",accept:{"application/json":[".json"]}}]}); saveFileHandle=h; jsonHandle=h; try{await idbSet("jsonHandle",h);}catch(e){} const f=await h.getFile(); loadStateText(await f.text()); }
    catch(err){ if(err&&err.name==="AbortError") return; console.warn(err); document.getElementById("jsonInput").click(); }   // FSA picker can fail (e.g. file:// pages); fall back to the file input
  } else document.getElementById("jsonInput").click();
});
document.getElementById("jsonInput").addEventListener("change",async e=>{ const f=e.target.files[0]; if(f) loadStateText(await f.text()); });

function serializeState(includeImages){
  return {
    version:3, folderName, savedAt:new Date().toISOString(),
    settings:{ baseLayer: map.hasLayer(google)?"google":map.hasLayer(esri)?"esri":"none", showNoGeo, sortBy:currentSort,
      thumb:getComputedStyle(document.documentElement).getPropertyValue("--thumb").trim(),
      galleryW:getComputedStyle(document.documentElement).getPropertyValue("--gallery-w").trim(), dateLo, dateHi,
      box: boxBounds?[boxBounds.getSouth(),boxBounds.getWest(),boxBounds.getNorth(),boxBounds.getEast()]:null,
      view:{ center:[map.getCenter().lat, map.getCenter().lng], zoom:map.getZoom() } },
    photos: photos.map(p=>{ const o={path:p.path,name:p.name,lat:p.lat,lng:p.lng,time:p.time,dir:p.dir,size:p.size,isHeic:p.isHeic};
      if(Array.isArray(p.paths)&&p.paths.length>1)o.paths=p.paths;   // preserve extra folder paths from de-duped overlaps
      if(p.marks&&p.marks.length)o.marks=p.marks;
      if(includeImages){ if(p.thumb)o.thumb=p.thumb; if(p.preview)o.preview=p.preview; if(p.full)o.full=p.full; } return o; })
  };
}
function loadStateText(text){
  if(!text || !text.trim()){ alert("That saved file is empty. The previous save most likely failed because the embedded images made it too large to write. Try narrowing the session with the date filter, enhancing fewer images, then saving again."); return; }
  let st;
  try{ st=JSON.parse(text); }
  catch(e){
    const truncated=text.trimEnd().slice(-1)!=="}";
    alert("Could not read that file as JSON ("+text.length.toLocaleString()+" characters)."+(truncated?" It looks cut off at the end, which means the save did not finish writing, usually because the file was very large. Narrow the date range or enhance fewer images, then save again.":" The file may be corrupted.")); return;
  }
  applyState(st);
}
function applyState(st){
  clearAll(false); folderName=st.folderName||"";
  (st.photos||[]).forEach(m=>photos.push({id:nextId++,path:m.path,name:m.name,paths:Array.isArray(m.paths)&&m.paths.length?m.paths:(m.path?[m.path]:[]),file:null,size:(m.size!=null?m.size:null),isHeic:!!m.isHeic,thumb:m.thumb||null,preview:m.preview||null,full:m.full||null,lat:m.lat,lng:m.lng,time:m.time,dir:m.dir,marks:Array.isArray(m.marks)?m.marks:[]}));
  const s=st.settings||{};
  if(s.thumb){ document.documentElement.style.setProperty("--thumb",s.thumb); document.getElementById("thumbSize").value=parseInt(s.thumb)||120; }
  if(s.galleryW) document.documentElement.style.setProperty("--gallery-w",s.galleryW);
  if(s.baseLayer==="esri"){ map.removeLayer(google); esri.addTo(map); } else if(s.baseLayer==="none"){ map.removeLayer(google); }
  showNoGeo=!!s.showNoGeo; document.getElementById("showNoGeo").checked=showNoGeo;
  currentSort=s.sortBy||"date_desc"; document.getElementById("sortSel").value=currentSort;
  buildDateFilter(); if(s.dateLo!=null&&dateMin!=null){ dateLo=s.dateLo; dateHi=s.dateHi; syncSliderUI(); }
  if(boxRect){map.removeLayer(boxRect);boxRect=null;} boxBounds=null;
  if(s.box){ boxBounds=L.latLngBounds([s.box[0],s.box[1]],[s.box[2],s.box[3]]); boxRect=L.rectangle(boxBounds,{color:"#5865F2",weight:2,fill:false,dashArray:"6 4"}).addTo(map); }
  setAreaBtn();
  buildCluster(); renderClusters(); updateStats(); updateGallery(); map.invalidateSize();
  if(s.view && Array.isArray(s.view.center)) map.setView(s.view.center, (s.view.zoom!=null?s.view.zoom:map.getZoom()));
  else fitToPhotos();
  maybeOfferReconnect();
}

/* persistence (IndexedDB): metadata only, cheap */
function idbOpen(){ return new Promise((res,rej)=>{ const o=indexedDB.open("photomap",1); o.onupgradeneeded=()=>o.result.createObjectStore("kv"); o.onsuccess=()=>res(o.result); o.onerror=()=>rej(o.error); }); }
async function idbSet(k,v){ const db=await idbOpen(); return new Promise((res,rej)=>{ const t=db.transaction("kv","readwrite"); t.objectStore("kv").put(v,k); t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); }); }
async function idbGet(k){ const db=await idbOpen(); return new Promise((res,rej)=>{ const t=db.transaction("kv","readonly"); const r=t.objectStore("kv").get(k); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function idbDel(k){ const db=await idbOpen(); return new Promise((res,rej)=>{ const t=db.transaction("kv","readwrite"); t.objectStore("kv").delete(k); t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); }); }
let persistTimer=null;
function persistState(){ clearTimeout(persistTimer); persistTimer=setTimeout(()=>{ idbSet("lastState",serializeState(false)).catch(()=>{}); },400); }

/* banner */
function showBanner(html,action){ document.getElementById("rcMsg").innerHTML=html; bannerAction=action; document.getElementById("reconnect").classList.add("show"); }
function hideBanner(){ document.getElementById("reconnect").classList.remove("show"); bannerAction=null; }
document.getElementById("btnReconnect").addEventListener("click",()=>{ if(bannerAction) bannerAction(); });
function maybeOfferReconnect(){
  const haveImg=photos.some(p=>p.thumb||p.preview);
  if(photos.length && !haveImg && dirHandle){ showBanner('Reconnect folder <b>'+esc(dirHandle.name||folderName||"folder")+'</b> to load images.',reconnectFolder); }
}
async function reconnectFolder(){ if(!dirHandle)return; if(!(await ensurePermission(dirHandle))){ alert("Permission to read the folder was not granted."); return; } folderName=dirHandle.name; hideBanner(); await loadFromHandle(dirHandle); }
async function reopenLastJson(){
  if(!jsonHandle){ try{ jsonHandle=await idbGet("jsonHandle"); }catch(e){} }
  if(!jsonHandle)return;
  try{
    let perm=await jsonHandle.queryPermission({mode:"read"});
    if(perm!=="granted"){ perm=await jsonHandle.requestPermission({mode:"read"}); }
    if(perm!=="granted") return;
    saveFileHandle=jsonHandle; const f=await jsonHandle.getFile(); loadStateText(await f.text()); hideBanner();
  }catch(e){ console.warn(e); }
}
async function ensurePermission(handle){ try{ const o={mode:"read"}; if((await handle.queryPermission(o))==="granted")return true; if((await handle.requestPermission(o))==="granted")return true; }catch(e){} return false; }
let permArmed=false;
/* A native permission dialog swallows the mouseup of the click that opened it,
   leaving Leaflet's drag handler stuck "pressed" so the map pans without the
   button held. Dispatch synthetic release events to clear any stuck drag. */
function releaseStuckDrag(){
  try{
    document.dispatchEvent(new MouseEvent("mouseup",{bubbles:true,cancelable:true}));
    window.dispatchEvent(new MouseEvent("mouseup",{bubbles:true,cancelable:true}));
    document.dispatchEvent(new PointerEvent("pointerup",{bubbles:true,cancelable:true}));
    window.dispatchEvent(new PointerEvent("pointerup",{bubbles:true,cancelable:true}));
  }catch(e){}
}
function armFolderPermission(){
  if(permArmed||!dirHandle) return; permArmed=true;
  const once=async(ev)=>{
    if(ev&&ev.target&&ev.target.closest&&ev.target.closest(".toolbar")) return;   // folder buttons handle their own permission
    window.removeEventListener("pointerdown",once,true); window.removeEventListener("keydown",once,true); permArmed=false;
    try{ if(dirHandle) await dirHandle.requestPermission({mode:"read"}); }catch(e){}
    finally{ releaseStuckDrag(); }
  };
  window.addEventListener("pointerdown",once,true); window.addEventListener("keydown",once,true);
}

/* helpers */
function photoById(id){ for(const p of photos) if(p.id===id) return p; return null; }
function updateStats(){ const total=photos.length,geo=photos.filter(p=>p.lat!=null).length; document.getElementById("stTotal").textContent=total; document.getElementById("stGeo").textContent=geo; document.getElementById("stNo").textContent=total-geo; }
function fmtDate(ms){ const d=new Date(ms); return d.toLocaleString(undefined,{year:"numeric",month:"short",day:"2-digit",hour:"2-digit",minute:"2-digit"}); }
function fmtCoord(lat,lng){ return lat.toFixed(5)+", "+lng.toFixed(5); }
function fmtSize(b){ if(b==null)return ""; const exact=b.toLocaleString()+" bytes"; if(b>=1048576)return (b/1048576).toFixed(2)+" MB ("+exact+")"; if(b>=1024)return (b/1024).toFixed(1)+" KB ("+exact+")"; return exact; }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* shared link opening (the copy button was removed; existing #s= links still open) */
function applyShared(P){
  if(!P||!Array.isArray(P.p))return false;
  if(boxRect){map.removeLayer(boxRect);boxRect=null;} boxBounds=null; setAreaBtn();
  photos=[]; nextId=1; undoStack=[];
  P.p.forEach(m=>photos.push({id:nextId++,path:m[2]||"",name:m[2]||"",paths:m[2]?[m[2]]:[],file:null,size:null,isHeic:false,thumb:null,preview:null,full:null,lat:(m[0]!=null?m[0]:null),lng:(m[1]!=null?m[1]:null),time:m[3]||null,dir:null,marks:[]}));
  buildDateFilter(); buildCluster(); renderClusters(); updateStats();
  if(P.vw){ try{ map.setView([P.vw[0],P.vw[1]],P.vw[2]); }catch(e){} }
  updateGallery();
  return true;
}
function parseShareHash(){
  const m=(location.hash||"").match(/[#&]s=([^&]+)/); if(!m) return false;
  try{ return applyShared(JSON.parse(LZString.decompressFromEncodedURIComponent(m[1]))); }catch(e){ return false; }
}

/* startup */
(async function init(){
  try{ if(typeof LZString!=="undefined" && parseShareHash()) return; }catch(e){}
  let full=null,last=null;
  try{ full=await idbGet("lastFull"); }catch(e){}
  try{ last=await idbGet("lastState"); }catch(e){}
  try{ jsonHandle=await idbGet("jsonHandle"); }catch(e){}
  try{ dirHandle=await idbGet("dirHandle"); }catch(e){}
  if(full && full.photos && full.photos.length){ applyState(full); }
  else if(last && last.photos && last.photos.length){ applyState(last); if(jsonHandle) showBanner('Reopen last session <b>'+esc(jsonHandle.name||"file")+'</b> to load the images.',reopenLastJson); }
  if(dirHandle){ try{ if((await dirHandle.queryPermission({mode:"read"}))!=="granted") armFolderPermission(); }catch(e){} }
})();
</script>
